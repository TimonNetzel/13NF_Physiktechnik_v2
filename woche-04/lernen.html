<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16233a">
<title>Simulation</title>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#15202e; --muted:#5b6778; --line:#d6dce4;
  --acc:#e4572e; --acc-d:#b83f1c; --blue:#1f6f8b; --ok:#23915a; --okbg:#e3f5ea; --bad:#cf3b3b; --badbg:#fde8e8;
  --gold:#f0b400; --nav:#16233a; --hint:#fff6d6; --hintb:#eed27a;
  --scr:#07140f; --trace:#7dffa6; --grid:rgba(125,255,166,.16);
  --r:16px; --sh:0 2px 10px rgba(20,32,46,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 0 8px}
.top .wrap{display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:7px 12px;color:#fff;font-weight:600;font-size:15px;min-height:40px;display:inline-flex;align-items:center;gap:4px}
.pill.gold{background:var(--gold);color:#241a00}
.iconbtn{min-width:44px;justify-content:center}
.dots{display:flex;gap:5px;padding:8px 0 2px;flex-wrap:wrap}
.dots i{height:6px;flex:1;min-width:10px;border-radius:3px;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold)} .dots i.cur{background:#fff}
/* home */
.hero{background:linear-gradient(160deg,#16233a 0%,#24406a 100%);color:#fff;padding:22px 0 26px}
.hero h2{margin:0 0 6px;font-size:26px;line-height:1.2}
.hero p{margin:0;opacity:.9}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;font-size:15px}
.stat b{font-size:20px;display:block}
.levels{display:grid;gap:12px;margin:18px auto 28px}
@media(min-width:700px){.levels{grid-template-columns:1fr 1fr}}
.lv{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:left;width:100%}
.lv:disabled{opacity:.5;cursor:default}
.lv.next{border-color:var(--acc)}
.lv .num{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:#e8edf3;color:var(--nav)}
.lv.done .num{background:var(--ok);color:#fff}
.lv.next .num{background:var(--acc);color:#fff}
.lv .tx{flex:1;min-width:0}
.lv .tag{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);font-weight:700}
.lv .tt{font-weight:700;font-size:17px}
.lv .sub{font-size:14px;color:var(--muted)}
.lv .st{font-size:22px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:var(--sh)}
.bdg.off{opacity:.35;filter:grayscale(1)}
/* step */
.step{padding:16px 0 120px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:20px;line-height:1.25}
.kicker{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.task{background:#eaf4f8;border-left:5px solid var(--blue);border-radius:10px;padding:10px 12px;margin:10px 0}
.task b:first-child{color:var(--blue)}
.story{display:flex;gap:12px;align-items:flex-start}
.ava{flex:0 0 54px;height:54px;border-radius:50%;background:#ffe2d6;display:grid;place-items:center;font-size:30px}
.bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:12px 14px;box-shadow:var(--sh);flex:1}
.bubble .who{font-weight:700;font-size:14px;color:var(--acc-d)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(238,241,245,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;gap:10px}
.btn{border:0;border-radius:14px;min-height:52px;padding:10px 18px;font-weight:700;background:var(--acc);color:#fff;box-shadow:0 2px 0 var(--acc-d)}
.btn:disabled{background:#b9c1cb;box-shadow:none;cursor:default}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.blue{background:var(--blue);box-shadow:0 2px 0 #134a5d}
.btn.wide{flex:1}
.btn.small{min-height:44px;padding:8px 14px;font-size:15px}
.hintbox{background:var(--hint);border:2px solid var(--hintb);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px}
/* mcq */
.mcq .q{font-weight:700;margin:4px 0 10px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:54px;font-size:16px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg);opacity:.75}
.fb{margin-top:10px;border-radius:12px;padding:0;font-size:16px}
.fb.ok{background:var(--okbg);padding:10px 12px;border:2px solid #9fd8b8}
.fb.bad{background:var(--badbg);padding:10px 12px;border:2px solid #f0b0b0}
.fb.info{background:#eaf4f8;padding:10px 12px;border:2px solid #b7d9e6}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* pick */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:14px;font-weight:600;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile svg{width:56px;height:56px}
.tile.sel{border-color:var(--blue);background:#e6f3f8}
.tile.good{border-color:var(--ok);background:var(--okbg)}
.tile.wrong{border-color:var(--bad);background:var(--badbg)}
/* place / seq */
.fig{background:#f7f9fb;border-radius:12px;padding:8px;margin:8px 0}
.fig svg{width:100%;height:auto;display:block}
.slots{display:grid;gap:8px;margin:10px 0}
.slot{display:flex;align-items:center;gap:10px;background:#fff;border:2px dashed #9fb0c2;border-radius:12px;padding:8px 10px;min-height:50px;text-align:left;width:100%}
.slot .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.act{border-color:var(--blue);background:#e6f3f8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:9px 14px;min-height:46px;font-weight:600;font-size:15px}
.chip.sel{border-color:var(--blue);background:var(--blue);color:#fff}
.seqlist{display:grid;gap:8px}
.seqitem{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;width:100%;font-size:16px}
.seqitem .n{flex:0 0 30px;height:30px;border-radius:50%;background:#e8edf3;display:grid;place-items:center;font-weight:800}
.seqitem.done{border-color:var(--ok);background:var(--okbg)} .seqitem.done .n{background:var(--ok);color:#fff}
/* calc */
.calc{display:grid;gap:10px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:#f7f9fb;border-radius:12px;padding:10px 12px;font-size:17px}
.crow.given{background:#eef2f6;color:#334}
.crow input{width:130px;min-height:46px;border:2px solid #9fb0c2;border-radius:10px;padding:6px 10px;font-size:18px;font-weight:700;text-align:right;background:#fff}
.crow input.okI{border-color:var(--ok);background:var(--okbg)}
.crow input.badI{border-color:var(--bad);background:var(--badbg)}
.crow .u{font-weight:600;color:var(--muted)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 3px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.tip{font-size:14px;color:var(--muted)}
/* scan */
.scanwrap{background:#1c2733;border-radius:14px;padding:8px;margin:10px 0;color:#cfe}
.scanhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 6px;font-size:13px}
.scanhead .t{font-weight:700;letter-spacing:.04em}
canvas.scan{display:block;width:100%;height:auto;aspect-ratio:16/8.5;border-radius:8px;background:var(--scr);touch-action:manipulation}
.seg{display:inline-flex;background:#2d3b4a;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#cfe;padding:6px 12px;border-radius:8px;min-height:36px;font-weight:700;font-size:14px}
.seg button.on{background:var(--trace);color:#062}
.readout{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 4px 0;font-size:14px;font-variant-numeric:tabular-nums}
.readout b{color:var(--trace)}
/* controls */
.ctrls{display:grid;gap:10px;margin-top:6px}
.ctl{background:#f7f9fb;border-radius:12px;padding:10px 12px}
.ctl .lab{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:6px}
.ctl .lab span{font-variant-numeric:tabular-nums;color:var(--blue)}
.ctl .row{display:flex;gap:8px;align-items:center}
.ctl input[type=range]{flex:1;min-width:0;height:36px;accent-color:var(--acc)}
.btns4{display:grid!important;grid-template-columns:repeat(4,1fr);margin-top:6px}
.sbtn{min-width:52px;min-height:46px;border:0;border-radius:12px;background:var(--nav);color:#fff;font-weight:800;font-size:16px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.btnrow .btn{flex:1;min-width:140px}
.check{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px;font-size:15px}
.check li:before{content:"⬜ "} .check li.ok:before{content:"✅ "}
/* scene */
.scene{width:100%;max-height:200px;display:block}
.wv{animation:wv 1.1s linear infinite;opacity:0}
.wv:nth-child(2){animation-delay:.37s}.wv:nth-child(3){animation-delay:.74s}
@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(62px);opacity:0}}
.weak .wv{animation-name:wvw}
@keyframes wvw{0%{transform:translateY(0);opacity:.25}30%{opacity:0}100%{transform:translateY(20px);opacity:0}}
/* device (Gerätemenü im Hardware-Look) */
.dev{background:#c8232c;border-radius:18px;padding:12px;box-shadow:0 4px 0 #8d141b}
.dev .scr{background:#0b1a14;color:#bfffd3;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.dev .scr .mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(191,255,211,.25)}
.dev .scr .mrow:last-child{border:0}
.dev .brand{color:#fff;font-weight:800;font-size:12px;letter-spacing:.12em;margin-top:8px;opacity:.9}
.dev .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dev .keys button{flex:1 0 64px;min-height:46px;border:0;border-radius:10px;background:#f0f0f0;color:#222;font-weight:800}
.dev .arrow{min-width:44px;min-height:40px;border:0;border-radius:8px;background:#2a4a3a;color:#bfffd3;font-weight:800}
/* table */
table.tb{border-collapse:collapse;width:100%;font-size:15px}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
.tb th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* decide */
.dcard{border:2px solid var(--line);border-radius:14px;padding:10px;margin:10px 0;background:#fff}
.dcard.ok{border-color:var(--ok);background:var(--okbg)}
.dcard h4{margin:0 0 4px}
.dbtns{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.dbtns{grid-template-columns:1fr 1fr 1fr}}
.dbtns button{min-height:50px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.dbtns button.bad{border-color:var(--bad);background:var(--badbg)} .dbtns button.ok{border-color:var(--ok);background:var(--okbg)}
/* cloze */
.cloze p{margin:0 0 12px;line-height:2}
.cloze select{min-height:44px;border:2px solid #9fb0c2;border-radius:10px;padding:4px 8px;max-width:100%;background:#fff;font-weight:600;font-size:16px}
.cloze select.okI{border-color:var(--ok);background:var(--okbg)} .cloze select.badI{border-color:var(--bad);background:var(--badbg)}
.doc{border:2px solid var(--nav);border-radius:12px;padding:16px;position:relative;background:#fffdf7;margin-top:12px}
.doc h4{margin:0 0 8px;font-size:19px}
.doc .stamp{position:absolute;right:12px;top:10px;border:3px solid var(--ok);color:var(--ok);font-weight:900;padding:4px 10px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.08em}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:15px}
.doc dt{font-weight:700;color:var(--muted)}
.doc dd{margin:0}
/* sheet */
.shade{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px}
@media(min-width:700px){.shade{align-items:center}.sheet{border-radius:20px}}
.calcdisp{background:#0b1a14;color:#bfffd3;font:600 24px/1.2 ui-monospace,Menlo,monospace;border-radius:12px;padding:12px;text-align:right;min-height:58px;word-break:break-all}
.calckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.calckeys button{min-height:54px;border:0;border-radius:12px;background:#e8edf3;font-size:20px;font-weight:700}
.calckeys button.op{background:#d5e6ee}.calckeys button.eq{grid-column:span 4;background:var(--acc);color:#fff}
.calckeys button.ex{font-size:16px}
.term{border-bottom:2px dotted var(--blue);color:var(--blue);font-weight:600;cursor:pointer}
.term:after{content:" ⓘ";font-size:.75em}
/* overlay */
.win{text-align:center;padding:10px 0}
.win .big{font-size:64px;line-height:1}
.float{position:fixed;z-index:60;font-weight:900;color:var(--gold);font-size:26px;text-shadow:0 1px 0 #7a5a00;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
.conf{position:fixed;top:-10px;width:10px;height:14px;z-index:70;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
/* cert */
.cert{background:linear-gradient(145deg,#16233a,#2a4b7a);color:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.cert:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(240,180,0,.18)}
.cert h2{margin:0;font-size:24px}
.cert .nm{font-size:30px;font-weight:900;margin:14px 0 2px;color:var(--gold)}
.cert .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.cert .row div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px}
.stars{font-size:30px;letter-spacing:4px;margin-top:8px;color:var(--gold)}
.bars{display:grid;gap:10px;margin:10px 0}
.bar{background:#e8edf3;border-radius:10px;height:26px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:10px}
.bar span{position:absolute;left:10px;top:3px;font-size:14px;font-weight:700}
small.m{color:var(--muted)}
input.name{width:100%;min-height:52px;border:2px solid #9fb0c2;border-radius:12px;padding:8px 12px;font-size:18px}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){--bg:#0f1621;--card:#1a2433;--ink:#e8eef6;--muted:#9fb0c2;--line:#2f3d50;--okbg:#153a28;--badbg:#3d1c1c;--hint:#3a3317;--hintb:#6d5d1d}
 :root:not([data-theme="light"]) .opt,:root:not([data-theme="light"]) .tile,:root:not([data-theme="light"]) .slot,:root:not([data-theme="light"]) .chip,:root:not([data-theme="light"]) .seqitem,:root:not([data-theme="light"]) .dcard,:root:not([data-theme="light"]) .dbtns button,:root:not([data-theme="light"]) .cloze select,:root:not([data-theme="light"]) .crow input,:root:not([data-theme="light"]) .bubble,:root:not([data-theme="light"]) .sheet,:root:not([data-theme="light"]) .bdg,:root:not([data-theme="light"]) input.name{background:#1f2b3c}
 :root:not([data-theme="light"]) .crow,:root:not([data-theme="light"]) .ctl,:root:not([data-theme="light"]) .fig{background:#223044}
 :root:not([data-theme="light"]) .fig{background:#e9eef4}
 :root:not([data-theme="light"]) .task{background:#16303c}
 :root:not([data-theme="light"]) .fb.info{background:#16303c;border-color:#24536a}
 :root:not([data-theme="light"]) .foot{background:rgba(15,22,33,.94)}
 :root:not([data-theme="light"]) .btn.sec{background:#1f2b3c}
 :root:not([data-theme="light"]) .doc{background:#1f2b3c}
 :root:not([data-theme="light"]) .calckeys button{background:#2a3a50}
 :root:not([data-theme="light"]) .calckeys button.op{background:#24485a}
 :root:not([data-theme="light"]) .lv .num{background:#2a3a50;color:#e8eef6}
 :root:not([data-theme="light"]) .bar{background:#2a3a50}
 :root:not([data-theme="light"]) .tile.sel,:root:not([data-theme="light"]) .slot.act{background:#16303c}
}
.sol h4{margin:16px 0 6px;font-size:17px;border-bottom:2px solid var(--line);padding-bottom:4px}
.sol ol{margin:0;padding-left:22px}.sol li{margin:4px 0}
.sol .a{color:var(--ok);font-weight:700}
@media print{.top,.foot,.shade .btn{display:none!important}.shade{position:static;background:none}.sheet{max-height:none;box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="pill iconbtn" id="bHome" aria-label="Übersicht">🏠</button>
  <h1 id="tTitle"></h1>
  <button class="pill iconbtn" id="bCalc" aria-label="Taschenrechner">🧮</button>
  <button class="pill iconbtn" id="bProto" aria-label="Messprotokoll">📋</button>
  <span class="pill gold" id="tPts">⭐ 0</span>
</div><div class="wrap"><div class="dots" id="dots"></div></div></header>
<main id="home"></main>
<main id="level" class="hidden"><div class="wrap step" id="stepBox"></div></main>
<main id="certView" class="hidden"></main>
<footer class="foot hidden" id="foot"><div class="wrap">
  <button class="btn sec" id="bHint">💡 Hilfe</button>
  <button class="btn wide" id="bNext" disabled>Weiter ▶</button>
</div></footer>
<script>
"use strict";
/* ===================== ENGINE (unverändert übernehmen) ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const fmt=(x,d=1)=>Number(x).toFixed(d).replace('.',',');
const rand=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseNum(s){
  if(s==null)return NaN; s=String(s).trim().replace(/\s/g,'').replace(/[−–]/g,'-'); if(!s)return NaN;
  s=s.replace(/·10\^?/g,'e').replace(/x10\^?/gi,'e');
  if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}
  else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}
  else if(/^\d{1,3}\.\d{3}$/.test(s)&&Number(s.replace('.',''))>=1000){return Number(s.replace('.',''))}
  return Number(s);
}

let cExpr='';
function calcDisp(){return cExpr.replace(/\*1e-6/g,'×10⁻⁶').replace(/\*1e-3/g,'×10⁻³').replace(/\*1e3/g,'×10³').replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−').replace(/\./g,',')||'0'}
function openCalc(){
  const keys=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0',',','×10⁻⁶','+','×10⁻³','×10³','x²','√','='];
  sheet(`<h3>🧮 Taschenrechner</h3><div class="calcdisp" id="cd"></div>
  <div class="calckeys">${keys.map(k=>`<button class="${'÷×−+'.includes(k)?'op':''}${k==='='?' eq':''}${/10|x²|√/.test(k)?' ex op':''}" data-k="${k}">${k}</button>`).join('')}</div>
  <p class="tip">Tipp: µ (Mikro) = ×10⁻⁶ · m (Milli) = ×10⁻³ · k (Kilo) = ×10³</p>
  <button class="btn sec wide" style="width:100%" data-close>Schließen</button>`,(s)=>{
    const d=$('#cd',s);const up=()=>d.textContent=calcDisp();up();
    const ev=()=>{const js=cExpr;if(!/^[0-9+\-*/().e]+$/.test(js))return NaN;try{return Function('"use strict";return ('+js+')')()}catch(e){return NaN}};
    $$('.calckeys button',s).forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==='C')cExpr='';else if(k==='⌫'){const m=cExpr.match(/\*1e-?\d$/);cExpr=m?cExpr.slice(0,-m[0].length):cExpr.slice(0,-1)}
      else if(k==='='||k==='x²'||k==='√'){let r=ev();if(k==='x²')r=r*r;if(k==='√')r=Math.sqrt(r);if(!isFinite(r)){d.textContent='Fehler';cExpr='';return}cExpr=String(Number(r.toPrecision(8)))}
      else cExpr+=({'÷':'/','×':'*','−':'-',',':'.','×10⁻⁶':'*1e-6','×10⁻³':'*1e-3','×10³':'*1e3'})[k]||k;
      up();
    });
  });
}

function pulseShape(u){ if(u<0||u>5)return 0; const osc=.55+.45*Math.abs(Math.cos(u*6.5)); return (u<.3?u/.3:Math.exp(-(u-.3)*1.5))*osc; }
/* o: {xmin,xmax,ymin=0,ymax=100, xdec, ylabels:[..], peaks:[{x,a}], pulse:x, ring, grass, curves:[{f:x=>y,color,w}], points:[{x,y}],
       targets:[x], htargets:[y], marks:[{x,label,row}], hl:[gridIndex], strich:bool, corner:'Text' } */
function drawScope(cv,o){
  const r=cv.getBoundingClientRect(); if(r.width<10)return;
  const dpr=window.devicePixelRatio||1, W=Math.round(r.width), H=Math.round(r.height);
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const ymin=o.ymin??0, ymax=o.ymax??100, pl=38,pr=o.strich?30:10,pt=10,pb=26, gw=W-pl-pr, gh=H-pt-pb;
  cv._lay={pl,pr,pt,pb,gw,gh,xmin:o.xmin,xmax:o.xmax,ymin,ymax};
  const X=x=>pl+(x-o.xmin)/(o.xmax-o.xmin)*gw, Y=a=>pt+gh-(a-ymin)/(ymax-ymin)*gh;
  c.fillStyle='#07140f';c.fillRect(0,0,W,H);
  for(let i=0;i<=10;i++){const x=pl+i*gw/10,h=o.hl&&o.hl.includes(i);c.strokeStyle=h?'rgba(255,196,0,.95)':'rgba(125,255,166,.16)';c.lineWidth=h?2.5:1;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+gh);c.stroke()}
  c.lineWidth=1;c.strokeStyle='rgba(125,255,166,.16)';
  for(let i=0;i<=10;i++){const y=pt+i*gh/10;c.beginPath();c.moveTo(pl,y);c.lineTo(pl+gw,y);c.stroke()}
  if(ymin<0&&ymax>0){c.strokeStyle='rgba(125,255,166,.45)';c.beginPath();c.moveTo(pl,Y(0));c.lineTo(pl+gw,Y(0));c.stroke()}
  c.textAlign='center';const step=W<420?2:1;
  for(let i=0;i<=10;i+=(o.strich?1:step)){const x=pl+i*gw/10,h=o.hl&&o.hl.includes(i);
    const xv=o.xmin+i*(o.xmax-o.xmin)/10,lab=o.strich?String(i+1):fmt(xv,o.xdec??(Math.abs(xv-Math.round(xv))<1e-6?0:1));
    c.fillStyle=h?'#ffc400':'rgba(200,255,220,.75)';c.font=h?'bold 12px -apple-system,sans-serif':'11px -apple-system,sans-serif';c.fillText(lab,x,H-9)}
  c.textAlign='right';c.fillStyle='rgba(200,255,220,.75)';c.font='11px -apple-system,sans-serif';
  (o.ylabels||[ymin,(ymin+ymax)/2,ymax]).forEach(a=>c.fillText(fmt(a,o.ydec??(Math.abs(a-Math.round(a))<1e-6?0:1)),pl-5,Y(a)+4));
  (o.targets||[]).forEach(t=>{const x=X(t);c.save();c.setLineDash([5,5]);c.strokeStyle='#ffc400';c.lineWidth=2;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+gh);c.stroke();c.restore()});
  (o.htargets||[]).forEach(t=>{const y=Y(t);c.save();c.setLineDash([5,5]);c.strokeStyle='#ffc400';c.lineWidth=2;c.beginPath();c.moveTo(pl,y);c.lineTo(pl+gw,y);c.stroke();c.restore()});
  c.save();c.beginPath();c.rect(pl-1,pt-1,gw+pr,gh+2);c.clip();
  const span=o.xmax-o.xmin;
  if(o.peaks||o.pulse!=null){ // Impuls-/Echo-Darstellung (gleichgerichtet)
    const ew=span*0.011, grass=(o.grass??2);c.beginPath();
    for(let px=0;px<=gw+(o.strich?pr-4:0);px++){const x=o.xmin+px/gw*span;let v=Math.random()*grass;
      if(o.pulse!=null)v=Math.max(v,Math.min(98,100*pulseShape((x-o.pulse)/(ew*(o.ring||2.4)))));
      (o.peaks||[]).forEach(e=>{v=Math.max(v,e.a*pulseShape((x-e.x)/ew)*(1+Math.random()*.04))});
      const y=Y(ymin+Math.min(v,99)/100*(ymax-ymin));px?c.lineTo(pl+px,y):c.moveTo(pl+px,y)}
    c.strokeStyle='#7dffa6';c.lineWidth=1.6;c.shadowColor='#7dffa6';c.shadowBlur=4;c.stroke();c.shadowBlur=0;
  }
  (o.curves||[]).forEach(cu=>{c.beginPath();for(let px=0;px<=gw;px++){const x=o.xmin+px/gw*span;let y=cu.f(x)+(cu.noise?rand(-cu.noise,cu.noise):0);if(!isFinite(y))continue;y=Y(Math.max(ymin-1e9,Math.min(ymax+1e9,y)));px?c.lineTo(pl+px,y):c.moveTo(pl+px,y)}

  (o.points||[]).forEach(p=>{c.fillStyle=p.color||'#4fc3ff';c.beginPath();c.arc(X(p.x),Y(p.y),p.r||5,0,7);c.fill()});
  c.restore();
  (o.marks||[]).forEach(m=>{const x=X(m.x);c.strokeStyle='#4fc3ff';c.lineWidth=2;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+gh);c.stroke();
    c.font='bold 12px -apple-system,sans-serif';const w=c.measureText(m.label).width+10;let bx=Math.min(Math.max(x-w/2,pl),pl+gw-w);
    c.fillStyle='#4fc3ff';c.fillRect(bx,pt+2+(m.row||0)*20,w,18);c.fillStyle='#021';c.textAlign='left';c.fillText(m.label,bx+5,pt+15+(m.row||0)*20)});
  if(o.corner){c.textAlign='right';c.fillStyle='rgba(200,255,220,.9)';c.font='bold 12px -apple-system,sans-serif';c.fillText(o.corner,pl+gw-4,pt+14)}
}

  <button class="btn blue" style="width:100%;margin-top:10px" id="sSave">Name speichern</button>

   $('#sReset',s).onclick=(e)=>{if(e.target.dataset.sure){const n=state.name;state=JSON.parse(JSON.stringify(S0));state.name=n;save();close();renderHome()}else{e.target.dataset.sure=1;e.target.textContent='Wirklich löschen? Nochmal tippen.'}};
  });

function askName(){
  sheet(`<div style="text-align:center"><div style="font-size:54px">${CONFIG.startEmoji}</div><h3>${CONFIG.title}</h3><p>${CONFIG.nameQuestion}</p></div>
  <input class="name" id="nIn" placeholder="Vorname" maxlength="30" autocomplete="off"><button class="btn wide" style="width:100%;margin-top:10px" id="nGo">Los geht's ▶</button>`,(s,close)=>{
   const go=()=>{state.name=$('#nIn',s).value.trim()||CONFIG.defaultName;save();close();renderHome()};$('#nGo',s).onclick=go;$('#nIn',s).addEventListener('keydown',e=>{if(e.key==='Enter')go()})});

/* ---------- Lösungsübersicht (aus den Level-Daten erzeugt) ---------- */
function solutionsHTML(){
  const one=S=>{const t=S.title?`<b>${stripTags(S.title)}</b>: `:'';
    switch(S.type){
     case 'mcq':return t+stripTags(S.q)+' → <span class="a">'+stripTags(S.o.find(o=>o.ok).t)+'</span>';
     case 'pick':return t+'<span class="a">'+S.items.filter(i=>i.ok).map(i=>stripTags(i.t)).join(', ')+'</span>';
     case 'place':return t+S.slots.map((a,i)=>`${i+1} = <span class="a">${stripTags(a)}</span>`).join(' · ');
     case 'seq':return t+'<ol>'+S.items.map(x=>`<li class="a">${stripTags(x)}</li>`).join('')+'</ol>';
     case 'calc':return t+'<ul>'+S.rows.filter(r=>!r.given).map(r=>`<li>${stripTags(r.pre)} <span class="a">${String(r.ans).replace('.',',')} ${r.u||''}</span></li>`).join('')+'</ul>';
     case 'decide':return t+S.cards.map(c=>`${stripTags(c.title)} → <span class="a">${stripTags(S.actions[c.ans])}</span>`).join(' · ');
     case 'cloze':return t+S.parts.map(p=>`<span class="a">${stripTags(p[1][p[2]])}</span>`).join(' | ');
     case 'sim':return t+'<span class="a">'+(S.solution||'(siehe Simulation)')+'</span>';
     default:return '';}};
  return `<div class="sol"><h3>📄 Lösungsübersicht – ${CONFIG.title}</h3>`+LEVELS.map((L,i)=>`<h4>Level ${i+1}: ${L.title} <small class="m">(${L.tag})</small></h4><ol>`+L.steps.filter(s=>s.type!=='info'&&s.type!=='quizEnd').map(s=>`<li>${one(s)}</li>`).join('')+'</ol>').join('')+'</div>';
}

/* ---------- Widgets ---------- */
function mcqW(container,S,onOk,onWrong){
  const d=document.createElement('div');d.className='mcq';
  d.innerHTML=`<p class="q">${typeof S.q==='function'?S.q():S.q}</p><div class="opts"></div><div class="fb"></div>`;
  const ob=$('.opts',d),fb=$('.fb',d);
  (S.noShuffle?S.o:shuffle(S.o)).forEach(o=>{const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;b._ok=!!o.ok;
    b.onclick=()=>{if(d.dataset.done)return;
      if(o.ok){b.classList.add('ok');d.dataset.done=1;fb.className='fb ok';fb.innerHTML='✅ '+(o.fb||'Richtig!');$$('.opt',ob).forEach(x=>x.disabled=true);onOk&&onOk()}
      else{b.classList.add('bad');b.disabled=true;shake(b);fb.className='fb bad';fb.innerHTML='❌ '+(o.fb||'Noch nicht – versuch es nochmal.');onWrong&&onWrong();
        if(S.quiz){$$('.opt',ob).forEach(x=>{x.disabled=true;if(x._ok)x.classList.add('ok')});d.dataset.done=1;onOk&&onOk()}}};
    ob.appendChild(b)});
  container.appendChild(d);return d;
}
const W={

 seq:(c,S,api)=>{

 calc:(c,S,api)=>{

 quizEnd:(c,S,api)=>{const q=quizScore(),n=QUIZ.length;

};

/* ---------- Start ---------- */
function buildQuizLevel(){
  const QL=LEVELS[LEVELS.length-1];
  QL.steps=[{type:'info',html:()=>person(`<p style="margin:0">Letzte Hürde, ${esc(state.name||CONFIG.defaultName)}! ${QUIZ.length} Fragen. Für jede Frage, die du <b>beim ersten Versuch</b> richtig hast, gibt's Punkte. Keine Hilfen – du schaffst das! 💪</p>`)}]
   .concat(QUIZ.map((q,i)=>({type:'mcq',quiz:1,q:`<small class="m">Frage ${i+1} von ${QUIZ.length}</small><br>${q.q}`,o:q.o.map(o=>Object.assign({},o,{fb:o.ok?q.why:'Leider nicht. '+q.why})),hints:[]})))
   .concat([{type:'quizEnd'}]);
}
function start(){
  state=load();document.title=CONFIG.title;buildQuizLevel();
  $('#bNext').onclick=()=>{const L=LEVELS[cur.li];if(cur.si<L.steps.length-1){cur.si++;renderStep()}else finishLevel()};
  $('#bHint').onclick=()=>{const S=ctx.S;if(!S.hints||!S.hints.length)return;const n=ctx.hint;if(n>=S.hints.length){shake($('#hintArea'));return}
    const lbl=['💡 Denkanstoß','📘 Wort-Hilfe','✏️ Erster Schritt'][n]||'💡 Tipp';
    const d=document.createElement('div');d.className='hintbox';d.innerHTML=`<b>${lbl}:</b> ${S.hints[n]}`;$('#hintArea').appendChild(d);
    ctx.hint++;state.hints++;save();$('#bHint').textContent=ctx.hint>=S.hints.length?'💡 Alle Hilfen offen':`💡 Hilfe (${ctx.hint+1}/${S.hints.length})`;d.scrollIntoView({behavior:'smooth',block:'nearest'})};
  $('#bHome').onclick=renderHome;$('#bCalc').onclick=openCalc;$('#bProto').onclick=openProto;
  renderHome();if(!state.name)askName();
}

/* p: {x0,span,period,tS,echoes:[{t,a,d,j}],marks,targets,corner,xdec,noCH1} */
function sc2(o,p){
  const P=p.period, tS=p.tS??1, x0=p.x0||0;
  (p.echoes||[]).forEach(e=>e._j=e.j?rand(-e.j,e.j):0);
  const burst=x=>{if(x<0||p.noCH1)return 0;const u=x%P;return u<tS?(Math.random()<.5?2.4:0):0};
  const ech=x=>{let v=0;(p.echoes||[]).forEach(e=>{const tt=e.t+e._j,d=e.d||1;for(let k=0;k*P<=x;k++){const u=x-k*P-tt;if(u>=0&&u<=d){v+=e.a*Math.pow(Math.sin(Math.PI*u/d),1.3)*(Math.random()*2-1)}}});return v+rand(-.06,.06)};
  drawScope(o.cv,{xmin:x0,xmax:x0+p.span,ymin:0,ymax:10,ylabels:[],xdec:p.xdec,curves:[{f:x=>6.4+burst(x),color:'#ffd400',w:1.4},{f:x=>2.6+ech(x),color:'#3ad0ff',w:1.2}],marks:p.marks,targets:p.targets,corner:p.corner});
  const L=o.cv._lay;if(!L)return;const c=o.cv.getContext('2d');c.font='bold 11px -apple-system,sans-serif';c.textAlign='left';
  c.fillStyle='#ffd400';c.fillText('1▸',6,L.pt+L.gh-6.4/10*L.gh+4);c.fillStyle='#3ad0ff';c.fillText('2▸',6,L.pt+L.gh-2.6/10*L.gh+4);
}

 {type:'sim',title:'Reflektor verschieben',run:simMove,solution:'Nah (≤ 0,30 m), weit (≥ 1,00 m) und ≥ 1,15 m einstellen; das Echo wandert nach rechts und trifft bei 1,20 m den nächsten Burst.',
  hints:['Nutze die ±-Tasten oder den Schieberegler.','Probiere 0,20 m, dann 1,00 m, dann 1,20 m.','Achte darauf, wo das blaue Echo im Vergleich zum zweiten gelben Burst liegt.']},

  hints:['Welcher gelbe Impuls ist der „Start“ für dieses Echo?','Wenn das Echo erst nach dem nächsten Burst ankommt, wird es falsch zugeordnet.','Die Pause ist zu kurz.']},
 {type:'sim',title:'Pause anpassen',run:simPause,solution:'delay(10) oder mehr: Burst alle 11 ms, Echo (≈ 9,7–10,7 ms) liegt frei. Kleinster sicherer Wert: 10 ms.',
  hints:['Das Echo bei 1,60 m beginnt bei ≈ 9,7 ms und dauert ≈ 1 ms.','Der nächste Burst kommt nach t_Sende + t_Pause = 1 ms + delay.','1 + delay muss größer als 10,7 ms sein → delay = 10.']}

{title:'Temperatur & Schallgeschwindigkeit',tag:'Durchführung',sub:'Aufgabe 2: c aus der Raumtemperatur',badge:'🌡️ Klima-Check',steps:[
 {type:'info',html:()=>person(`<p style="margin:0">Schall ist in warmer Luft schneller als in kalter. Bevor du Abstände berechnest, brauchst du deshalb die ${T('c','Schallgeschwindigkeit')} bei unserer Raumtemperatur.</p>`)+`<div class="task"><b>Aus der Anleitung (2, Aufgabe 2):</b> Messen Sie die Raumtemperatur und berechnen Sie die Schallgeschwindigkeit.</div>`},
 {type:'mcq',proto:['temp',18],pre:()=>`<div class="fig" style="max-width:260px;margin:auto">${thermoSVG(18)}</div>`,q:'Lies das Thermometer im Labor ab.',o:[

 {type:'sim',title:'Was wäre, wenn …?',run:simTemp,solution:'Wärmer → Echo früher (c größer); größere Sendestärke → Echo höher, aber gleiche Laufzeit.',
  hints:['Schiebe die Temperatur ganz nach links und ganz nach rechts.','Vergleiche den Beginn des Echos mit der gelben Linie.','Die Lautstärke ändert die Höhe, nicht die Lage auf der Zeitachse.']}
]},
{title:'Laufzeiten messen',tag:'Auswertung',sub:'Aufgabe 3: Δt ablesen, s berechnen',badge:'⏱️ Laufzeit-Profi',steps:[
 {type:'info',html:()=>person(`<p style="margin:0">Jetzt wird gemessen! Wir nennen unser Sensorpaar <b>Aufbau A</b>. Die Pause steht auf ${state.sim.pause||10} ms, damit auch weite Echos frei liegen. Du liest die ${T('dt','Laufzeit Δt')} ab – vom Beginn des Sendeimpulses bis zum Beginn des Echos.</p>`)},
 {type:'sim',title:'Kästchen zählen',run:simCount,solution:'Echo beginnt nach ≈ 4,8 Div → Δt ≈ 4,8 ms (genau 4,79 ms).',
  hints:['Die Zeitmessung startet am Anfang des gelben Impulses (0 ms).','Zähle die Kästchen bis zum Anfang des blauen Echos.','4,8 Kästchen · 1 ms pro Kästchen.']},
 {type:'sim',title:'Messreihe aufnehmen',run:simMeasure,solution:'A: 0,20 m → 1,29 ms · 0,40 → 2,46 · 0,60 → 3,62 · 0,80 → 4,79 · 1,00 → 5,96 · 1,20 → 7,13 ms (+ 4 Kollegenwerte).',
  hints:['Erst einen Abstand oben antippen.','Dann im Bildschirm genau auf den Anfang des blauen Echos tippen.','Nach „übernehmen“ den nächsten Abstand wählen – 6 Stück.']},
 {type:'calc',title:'Abstand wie in der Anleitung berechnen',text:()=>`Aus der Anleitung (Aufgabe 3): „… berechnen Sie mit Hilfe der Schallgeschwindigkeit die Abstände.“ Wegen des ${T('doppel','Doppelwegs')} gilt s = c · Δt / 2. Beispiel: Δt = 4,79 ms, c = 342,1 m/s.`,rows:[
   {pre:'Δt = 4,79 ms =',ans:0.00479,tol:0.000005,u:'s',w:150},
   {pre:'c · Δt = 342,1 m/s · 0,00479 s =',ans:1.639,tol:0.003,u:'m'},
   {pre:'s = 1,639 m : 2 =',ans:0.819,tol:0.0015,u:'m',proto:['sNaiv',0.819]}],
  after:'Aber Achtung: Laut Wegskala steht der Reflektor bei <b>0,80 m</b>. Die Rechnung liegt ≈ 19 mm zu weit. 🤔',
  hints:['Zuerst ms in s umrechnen: durch 1000 teilen.','Dann c mal Δt, danach durch 2 (hin und zurück).','4,79 ms = 0,00479 s; 342,1 · 0,00479 ≈ 1,639; : 2 ≈ 0,819.']},
 {type:'mcq',q:'Die Rechnung ergibt 0,819 m, die Wegskala zeigt 0,80 m. Woher kommen die 19 mm?',o:[
   {t:'Die angezeigte Zeit enthält eine kleine Systemzeit der Messkette (Auslösen, Einschwingen, Verstärker).',ok:1,fb:'Genau! Diese Zusatzzeit heißt Offset t₀. Im nächsten Level bestimmst du sie.'},
   {t:'Der Schall ist in Wirklichkeit viel langsamer.',fb:'Dann wären alle Abstände um denselben Faktor falsch. Hier steckt ein fester Zeitrest dahinter – das zeigt das nächste Level.'},
   {t:'Das Teilen durch 2 war falsch.',fb:'Ohne ÷ 2 kämen 1,64 m heraus – doppelt so weit wie die Bank. Der Doppelweg stimmt.'},
   {t:'Die Wegskala der Bank ist kaputt.',fb:'Die Wegskala ist unsere Referenz. Der Fehler steckt in der gemessenen Zeit.'}],
  hints:['Die Rechnung nimmt an: Die ganze Zeit ist Schallweg.','Stimmt das? Auch Elektronik braucht etwas Zeit.','Es gibt eine kleine Zusatzzeit in der Messkette.']}
]},
{title:'Kalibriergerade',tag:'Auswertung',sub:'Δt-s-Diagramm, m und t₀ für A und B',badge:'📈 Geraden-Profi',steps:[
 {type:'info',html:()=>person(`<p style="margin:0">Am Nachbarplatz steht <b>Aufbau B</b> – gleiche Bauart, aber ein anderes Empfänger-Modul. Beide messen dieselben Abstände zur selben Tafel. Meine Frage an dich: <b>Reicht eine gemeinsame Formel für A und B?</b> Dafür brauchst du die ${T('kalib','Kalibriergerade')}.</p>`)+`<table class="tb" style="margin-top:10px"><tr><th>s in m</th><th>A: Δt in ms</th><th>B: Δt in ms</th></tr>${Object.keys(DATA_A).map(s=>`<tr><td>${fmt(+s,2)}</td><td>${fmt(DATA_A[s],2)}</td><td>${fmt(DATA_B[s],2)}</td></tr>`).join('')}</table>`},
 {type:'sim',title:'Messpunkte ins Diagramm',run:simPlot,solution:'A und B eintragen, Geraden zeichnen, Lupe: Die A-Gerade trifft die Zeitachse bei ≈ 0,12 ms; B liegt fast parallel ≈ 0,16 ms höher.',
  hints:['Tippe die vier Knöpfe nacheinander.','Die Geraden gibt es erst, wenn A und B eingetragen sind.','Mit der Lupe siehst du den Bereich nahe s = 0 vergrößert.']},
 {type:'calc',title:T('m','Steigung m')+' aus den Endpunkten',text:'Endpunkte A: (0,20 m | 1,29 ms) und (1,20 m | 7,13 ms) · B: (0,20 m | 1,45 ms) und (1,20 m | 7,31 ms)',rows:[
   {pre:'Zeitdifferenz A: 7,13 − 1,29 =',ans:5.84,tol:0.005,u:'ms'},
   {pre:'Abstandsdifferenz: 1,20 − 0,20 =',ans:1.00,tol:0.001,u:'m'},
   {pre:'m_A = 5,84 ms : 1,00 m =',ans:5.84,tol:0.005,u:'ms/m',proto:['mA',5.84]},
   {pre:'m_B = (7,31 − 1,45) ms : 1,00 m =',ans:5.86,tol:0.005,u:'ms/m',proto:['mB',5.86]}],
  after:'Die Steigungen sind fast gleich – aber reicht das?',
  hints:['Steigung = Zeitänderung geteilt durch Abstandsänderung.','Zweite Zeit minus erste Zeit, zweiter Abstand minus erster Abstand.','A: 7,13 − 1,29 = 5,84; B: 7,31 − 1,45 = 5,86 – jeweils durch 1,00 m.']},
 {type:'calc',title:T('t0','Offset t₀')+' bestimmen',text:'Modell: Δt = m · s + t₀ → t₀ = Δt − m · s. Nimm den Punkt bei s = 0,20 m.',rows:[
   {pre:'Laufzeitanteil A: 5,84 ms/m · 0,20 m =',ans:1.168,tol:0.002,u:'ms'},
   {pre:'t₀,A = 1,29 − 1,168 ≈',ans:0.12,tol:0.0025,u:'ms',proto:['t0A',0.12]},
   {pre:'Laufzeitanteil B: 5,86 ms/m · 0,20 m =',ans:1.172,tol:0.002,u:'ms'},
   {pre:'t₀,B = 1,45 − 1,172 ≈',ans:0.28,tol:0.0025,u:'ms',proto:['t0B',0.28]}],
  after:'Ab jetzt rechnen wir mit den gerundeten Werten t₀,A = 0,12 ms und t₀,B = 0,28 ms. Der Rest ist eine <b>Zeit</b> der Messkette – keine negative Entfernung.',
  hints:['„Gemessene Zeit minus Laufzeitanteil ergibt Systemzeit.“','Erst m · 0,20 rechnen, dann von der gemessenen Zeit abziehen.','A: 5,84 · 0,20 = 1,168 → 1,29 − 1,168 = 0,122 ≈ 0,12.']},
 {type:'calc',title:'Schallgeschwindigkeit aus der Steigung',text:()=>`Wegen des Doppelwegs gilt m = 2/c, also c = 2/m. Vorher umrechnen: 1 ms = 0,001 s.`,rows:[
   {pre:'m_A = 5,84 ms/m =',ans:0.00584,tol:0.000005,u:'s/m',w:150},
   {pre:'c_A = 2 m : 0,00584 s =',ans:342.5,tol:0.6,u:'m/s',proto:['cA',342.5]},
   {pre:'c_B = 2 m : 0,00586 s =',ans:341.3,tol:0.5,u:'m/s',proto:['cB',341.3]}],
  hints:['ms/m in s/m: durch 1000 teilen.','Dann 2 durch diese Zahl teilen.','2 : 0,00584 ≈ 342,5 und 2 : 0,00586 ≈ 341,3.']},
 {type:'mcq',q:'c_A ≈ 342,5 m/s, aus dem Thermometer kam c = 342,1 m/s. Was folgt daraus?',o:[
   {t:'Passt gut: Die Steigung beschreibt den Schallweg in Luft bei ca. 18 °C. Die 19 mm Abweichung kamen vom Offset.',ok:1,fb:'Genau. Die Steigung „stimmt“ – das Problem war nur der Zeitnullpunkt.'},
   {t:'Die Steigung m ist die Schallgeschwindigkeit.',fb:'Schau auf die Einheiten: m hat ms/m, c hat m/s. Es gilt c = 2/m.'},
   {t:'Die Temperaturmessung war falsch.',fb:'Die Werte passen doch fast perfekt zusammen (Unterschied nur ≈ 0,1 %).'}],
  hints:['Vergleiche die beiden Zahlen.','Wenn c stimmt, woher kam dann der Fehler bei 0,80 m?','Der Fehler steckt im Offset, nicht in c.']},
 {type:'sim',title:'Geraden-Labor',run:simSlider,solution:'t₀ verschiebt parallel, m dreht. Passend: m = 5,84 ms/m, t₀ = 0,12 ms. Gleiche Steigung ≠ gleicher Offset → zwei Formeln.',
  hints:['Bewege erst nur den oberen Regler.','Dann nur den unteren.','Ziel: t₀ = 0,12 ms und m = 5,84 ms/m.']}
]},

   {pre:'s_naiv = 4,97 ms : 5,86 ms/m =',ans:0.848,tol:0.0015,u:'m'},
   {pre:'Unterschied: 0,848 m − 0,800 m ≈',ans:48,tol:1,u:'mm'}],
