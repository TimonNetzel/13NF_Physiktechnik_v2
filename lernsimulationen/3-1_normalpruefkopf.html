<style>
:root{
  color-scheme:light;
  --bg:#eef2f7; --card:#ffffff; --ink:#132033; --muted:#4d5a6b; --line:#cfd7e2;
  --acc:#c2410c; --acc-d:#8f2f08; --blue:#17607a; --blue-d:#0f4557;
  --ok:#1b7a47; --okbg:#e2f4e9; --bad:#b42318; --badbg:#fde7e5;
  --gold:#f2b705; --nav:#16233a; --hint:#fff4d1; --hintb:#e7c75c;
  --boss:#7a1d2e; --bossbg:#fbeef1; --purple:#5b3fc4;
  --r:16px; --sh:0 2px 10px rgba(20,32,46,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.katex{font-size:1.08em}
.katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 0 6px}
.top .wrap{display:flex;align-items:center;gap:6px}
.top h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:7px 11px;color:#fff;font-weight:700;font-size:15px;min-height:42px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill.gold{background:var(--gold);color:#241a00}
.iconbtn{min-width:44px;justify-content:center}
.dots{display:flex;gap:5px;padding:8px 0 2px;flex-wrap:wrap}
.dots button{height:12px;flex:1;min-width:14px;border:0;padding:0;border-radius:6px;background:rgba(255,255,255,.22);position:relative}
.dots button:disabled{cursor:default;opacity:.55}
.dots button.on{background:var(--gold)} .dots button.cur{background:#fff;outline:2px solid var(--gold);outline-offset:1px}
/* home */
.hero{background:linear-gradient(160deg,#16233a 0%,#24406a 100%);color:#fff;padding:22px 0 24px}
.hero h2{margin:0 0 6px;font-size:25px;line-height:1.2}
.hero p{margin:0;color:#e6edf6}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;font-size:15px;color:#e6edf6}
.stat b{font-size:20px;display:block;color:#fff}
.rankbox{margin-top:14px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.rankbox .rk{font-weight:800;font-size:18px;color:var(--gold)}
.rankladder{display:flex;gap:4px;margin-top:8px}

.kopt.right{outline:5px solid #13203380;outline-offset:2px;opacity:1}
.kres{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:16px}
.kres.ok{background:var(--okbg);border:2px solid #9fd2b4}
.kres.bad{background:var(--badbg);border:2px solid #efaca5}
.kres .kp{font-size:24px;font-weight:900}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f4f7fa;border-radius:12px;padding:10px 12px;margin:10px 0}
.toggle button{min-width:96px;min-height:44px;border-radius:999px;border:0;font-weight:800;background:var(--purple);color:#fff}
.toggle button.off{background:#c3cad3;color:#253041}
/* cert */
.cert{background:linear-gradient(145deg,#16233a,#2a4b7a);color:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.cert:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(242,183,5,.18)}
.cert h2{margin:0;font-size:24px}
.cert .nm{font-size:30px;font-weight:900;margin:14px 0 2px;color:var(--gold)}
.cert .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cert .row div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}
.stars{font-size:30px;letter-spacing:4px;margin-top:8px;color:var(--gold)}
input.name{width:100%;min-height:52px;border:2px solid #8fa1b5;border-radius:12px;padding:8px 12px;font-size:18px;background:#fff}
.sol h4{margin:16px 0 6px;font-size:17px;border-bottom:2px solid var(--line);padding-bottom:4px}
.sol ol{margin:0;padding-left:22px}.sol li{margin:4px 0}
.sol .a{color:var(--ok);font-weight:700}
@media print{.top,.foot,.calcwin{display:none!important}.shade{position:static;background:none}.sheet{max-height:none;box-shadow:none}}
@media (max-height:520px){.calckeys button{min-height:34px;font-size:16px}.calcdisp{min-height:40px;font-size:19px}}
/* ===== Lernsimulation v2: Messbild, Gerät, Labor ===== */
.calckeys button{min-width:0;padding:0 2px}.calckeys button.ex{font-size:15px;background:#e9e3fb}
:root{--scr:#07140f;--trace:#7dffa6}
.scanwrap{background:#1c2733;border-radius:14px;padding:8px;margin:10px 0;color:#d6ffe4}
.scanhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 6px;font-size:13px}
.scanhead .t{font-weight:700;letter-spacing:.04em}
canvas.scan{display:block;width:100%;height:auto;aspect-ratio:16/8.5;border-radius:8px;background:var(--scr);touch-action:manipulation}
@media (max-height:520px){canvas.scan{max-height:calc(100vh - 170px)}}
.seg{display:inline-flex;background:#2d3b4a;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#d6ffe4;padding:6px 12px;border-radius:8px;min-height:36px;font-weight:700;font-size:14px}
.seg button.on{background:var(--trace);color:#05301a}
.scanwrap .readout{color:#d6ffe4;padding:6px 4px 0}
.scanwrap .readout b{color:var(--trace)}
.btns4{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.btns4 .sbtn{min-width:0;font-size:15px}
.scene{width:100%;max-height:220px;display:block}
/* Gerätemenü im Hardware-Look */
.dev{background:#c8232c;border-radius:18px;padding:12px;box-shadow:0 4px 0 #8d141b;margin:10px 0}
.dev .scr{background:#0b1a14;color:#c9ffd9;border-radius:8px;padding:8px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.dev .scr .mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed rgba(201,255,217,.25);border-radius:6px}
.dev .scr .mrow:last-child{border-bottom:0}
.dev .scr .mrow.sel{background:#1f4a35;outline:2px solid #7dffa6}
.dev .scr .mrow b{color:#fff}
.dev .brand{color:#fff;font-weight:800;font-size:12px;letter-spacing:.12em;margin-top:8px}
.dev .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.dev .keys button{min-height:48px;border:0;border-radius:10px;background:#f0f0f0;color:#1d1d1d;font-weight:800;font-size:16px}
.dev .keys button.ok{background:#1b7a47;color:#fff}
/* Fotos aus dem Material */
.photo{margin:10px 0;background:#f7f9fb;border-radius:12px;padding:6px}
.photo .pw{position:relative;line-height:0}
.photo img{width:100%;height:auto;border-radius:8px;display:block}
.photo .pm{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#c2410c;color:#fff;font:800 15px/30px -apple-system,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.photo figcaption{font-size:13px;color:var(--muted);padding:6px 4px 0;line-height:1.35}
.zoomable{cursor:zoom-in}
/* Niveau, Zeitplan, Kür */
.nvgrid{display:grid;gap:10px;margin:10px 0}
.nvbtn{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;min-height:64px;width:100%}
.nvbtn .e{font-size:30px;flex:0 0 40px;text-align:center}
.nvbtn b{display:block;font-size:17px}
.nvbtn span{font-size:14px;color:var(--muted)}
.nvbtn.on{border-color:var(--blue);background:#e3f0f6}
.planbox{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-top:14px;border-left:6px solid var(--blue)}
.planbox h3{margin:0 0 4px;font-size:17px}
.planbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#e3e9f1;margin:8px 0 4px}
.planbar i{display:block;height:100%;border-right:2px solid #fff}
.planbar i.d{background:var(--ok)} .planbar i.o{background:#b9c6d6} .planbar i.k{background:#f2d27a}
.lv .min{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.lv.kuer{border-style:dashed;border-color:#e0c25a;background:#fffbea}
.lv.kuer .num{background:#f2d27a;color:#3a2a00}
.kuerlbl{display:inline-block;background:var(--gold);color:#241a00;border-radius:6px;padding:0 6px;font-size:11px;font-weight:800;margin-left:4px}
.nvtag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;background:rgba(255,255,255,.16);color:#fff}
/* Prognose */
.pred{background:#f1ecff;border:2px solid #cfc2fb;border-radius:12px;padding:10px 12px;margin:10px 0}
.pred b:first-child{color:var(--purple)}
.pred.ok{background:var(--okbg);border-color:#9fd2b4}.pred.bad{background:#fff4d1;border-color:var(--hintb)}
/* Störungssuche */
.fcase{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0;background:#fff}
.fcase.ok{border-color:var(--ok);background:var(--okbg)}
.fcase h4{margin:0 0 4px;font-size:17px}
.fcase .opts{margin-top:8px}
/* Schirmbilder, Labor, Protokoll */
.shotbtn{width:100%;margin-top:8px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:8px 0}
.shots figure{margin:0;background:#f4f7fa;border-radius:10px;padding:6px;font-size:12px;color:var(--muted)}
.shots img{width:100%;border-radius:6px;display:block}
.labrow{background:#f4f7fa;border-radius:12px;padding:10px 12px;margin:8px 0}
.labrow .lt{font-weight:800;font-size:15px;margin-bottom:6px}
.labrow .li{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.labrow input{width:110px;min-height:46px;border:2px solid #8fa1b5;border-radius:10px;padding:6px 10px;font-size:18px;font-weight:700;text-align:right;background:#fff}
.labrow .res{margin-top:6px;font-size:15px}
.dev3{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}
.dev3.g{background:var(--okbg);color:var(--ok)}.dev3.y{background:#fff4d1;color:#6b5200}.dev3.r{background:var(--badbg);color:var(--bad)}
.labcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-top:14px;border-left:6px solid var(--purple);display:flex;gap:12px;align-items:center}
.labcard .tx{flex:1;min-width:0}
.labcard b{display:block}
/* Führerschein + Prüfcode */
.lic-stamp{display:inline-block;border:3px solid #7dffa6;color:#7dffa6;font-weight:900;padding:4px 12px;border-radius:8px;transform:rotate(-6deg);letter-spacing:.08em;margin-top:12px}
.lic-stamp.no{border-color:#ffb199;color:#ffb199}
.pcode{font:800 26px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--gold)}
.miss{background:#fff;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;color:var(--ink)}
/* Druckansicht Protokoll */
#printView{display:none}
@media print{
 body.printing>*:not(#printView){display:none!important}
 body.printing #printView{display:block;padding:0 4mm;font-size:11pt}
 #printView h2{font-size:16pt;margin:0 0 4px} #printView h3{font-size:12.5pt;margin:12px 0 4px;border-bottom:2px solid #c2410c}
 #printView table{border-collapse:collapse;width:100%} #printView td,#printView th{border:1px solid #b8c3cf;padding:4px 6px;text-align:left;font-size:10pt}
 #printView .shots{grid-template-columns:1fr 1fr} #printView figure{break-inside:avoid}
 #printView .sig{margin-top:18mm;display:grid;grid-template-columns:1fr 1fr;gap:16mm} #printView .sig div{border-top:1px solid #000;padding-top:2px;font-size:9pt}
}
@media print{.top,.foot,.calcwin{display:none!important}.shade{position:static;background:none}.sheet{max-height:none;box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="pill iconbtn" id="bHome" aria-label="Übersicht">🏠</button>
  <h1 id="tTitle"></h1>
  <button class="pill iconbtn" id="bProto" aria-label="Messprotokoll">📋</button>
  <button class="pill iconbtn" id="bData" aria-label="Daten und Formeln">📂</button>
  <button class="pill iconbtn" id="bCalc" aria-label="Taschenrechner">🧮</button>
  <span class="pill gold" id="tPts">⭐ 0</span>
</div><div class="wrap"><div class="dots" id="dots"></div></div></header>
<main id="home"></main>
<main id="level" class="hidden"><div class="wrap step" id="stepBox"></div></main>
<main id="certView" class="hidden"></main>
<footer class="foot hidden" id="foot"><div class="wrap">
  <button class="btn sec back" id="bBack" aria-label="Zurück">◀</button>
  <button class="btn sec" id="bHint">💡 Hilfe</button>
  <button class="btn wide" id="bNext" disabled>Weiter ▶</button>
</div></footer>
<div class="calcwin hidden" id="calcWin" role="dialog" aria-label="Taschenrechner">
  <div class="cwh" id="cwh">🧮 <small>Rechner · hier ziehen zum Verschieben</small><button id="cwx" aria-label="Rechner schließen">✕</button></div>
  <div class="cwb"><div class="calcdisp" id="cd"><small id="cdh"></small><span id="cdv">0</span></div><div class="calckeys" id="ck"></div>
  <button class="btn blue small cwins" id="cwIns">↵ Ergebnis ins Eingabefeld</button></div>
</div>
<div id="printView"></div>

<script>
"use strict";
/* ===================== ENGINE „Lernsimulation“ v2 (unverändert übernehmen) =====================
   Versuchsablauf (Aufbau → Durchführung → Auswertung → Freigabe) + Spielmechanik aus dem Lernabenteuer
   (Gegner, Ränge, Wer/Ziel/Wie, Kahoot-Quiz) + Niveau (3 Stufen), Zeitplan 45/90 min mit Kür,
   Prognose, Störungssuche, Schirmbilder, Messprotokoll mit Druck, eigene Laborwerte, Laborführerschein mit Prüfcode. */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const fmt=(x,d=1)=>Number(x).toFixed(d).replace('.',',').replace('-','−');
const rand=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/\s/g,'').replace(/[−–]/g,'-');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)}
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- Formeln (KaTeX, offline eingebettet) ---------- */
function K(tex,disp){let h;try{h=katex.renderToString(tex,{throwOnError:false,displayMode:!!disp,strict:false,output:'html'})}catch(e){h=esc(tex)}return `<span class="kx" data-tex="${esc(tex)}">${h}</span>`}
const KD=tex=>K(tex,true);
function tex2txt(t){const sub={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
  let s=t;for(let k=0;k<3;k++)s=s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)');
  return s.replace(/\\text\{([^}]*)\}/g,'$1').replace(/\\mathrm\{([^}]*)\}/g,'$1').replace(/\\cdot/g,'·').replace(/\\Delta\s?/g,'Δ').replace(/\{,\}/g,',').replace(/\\approx/g,'≈').replace(/\\mid/g,'|').replace(/\\left|\\right/g,'').replace(/\\[,;!:]/g,' ').replace(/\\quad/g,'  ').replace(/\\Rightarrow/g,'⇒').replace(/\\le/g,'≤').replace(/\\ge/g,'≥').replace(/\\mu/g,'µ').replace(/\\%/g,'%').replace(/_(\d)/g,(m,d)=>sub[d]).replace(/_\{(\d)\}/g,(m,d)=>sub[d]).replace(/[{}]/g,'').replace(/\\/g,'').replace(/-/g,'−').replace(/\s+/g,' ').trim()}
function plain(h){const d=document.createElement('div');d.innerHTML=String(typeof h==='function'?h():h);$$('.kx',d).forEach(k=>k.replaceWith(document.createTextNode(tex2txt(k.dataset.tex))));$$('br',d).forEach(b=>b.replaceWith(' '));return d.textContent.replace(/\s+/g,' ').trim()}
const OP=o=>`<span class="op">${o}</span>`;

/* ---------- Zustand ---------- */
const S0={name:'',nv:0,points:0,done:{},awarded:{},solved:{},maxStep:{},stepIdx:{},hints:0,quiz:{},teacher:false,sim:{},timer:true,bossHints:{},proto:{},shots:{},lab:{},labPts:{},pred:{},act:0};
let state;
function load(){try{const s=JSON.parse(localStorage.getItem(CONFIG.key));if(s)return Object.assign(JSON.parse(JSON.stringify(S0)),s)}catch(e){}return JSON.parse(JSON.stringify(S0))}
function save(){try{localStorage.setItem(CONFIG.key,JSON.stringify(state))}catch(e){try{state.shots={};localStorage.setItem(CONFIG.key,JSON.stringify(state))}catch(_){}}}

/* ---------- Niveau (3 Stufen, am Start wählbar) ---------- */
const NV={1:{k:'easy',e:'🟢',name:'Einsteiger',txt:'Rechnungen in kleinen Schritten, alle 3 Hilfen.',mult:1,hints:3,rev:2},
          2:{k:'std', e:'🔵',name:'Standard',  txt:'Normale Aufgaben, alle 3 Hilfen. Punkte ×1,2.',mult:1.2,hints:3,rev:2},
          3:{k:'pro', e:'🔴',name:'Profi',     txt:'Formeln selbst aufstellen, nur 2 Hilfen. Punkte ×1,5.',mult:1.5,hints:2,rev:3}};
const nvk=()=>(NV[state.nv]||NV[2]).k;
/* Schritte je Niveau: nv:[1,2] = nur in diesen Stufen; easy:{…}/std:{…}/pro:{…} überschreibt Felder */
function prepSteps(){LEVELS.forEach(L=>{if(L.quiz)return;L._st=L.steps.filter(s=>!s.nv||s.nv.includes(state.nv||2)).map(s=>s[nvk()]?Object.assign({},s,s[nvk()]):s)})}
const ST=L=>L._st||L.steps;

/* ---------- Wort-Hilfe ---------- */
const T=(k,txt)=>`<span class="term" data-g="${k}" role="button" tabindex="0">${txt||(GL[k]?GL[k][0]:k)}</span>`;
document.addEventListener('click',e=>{const t=e.target.closest('.term');if(t&&GL[t.dataset.g]){const g=GL[t.dataset.g];sheet(`<h3>📘 ${g[0]}</h3><p>${g[1]}</p><button class="btn wide" style="width:100%" data-close>Verstanden</button>`)}
  const z=e.target.closest('img.zoomable');if(z)sheet(`<img src="${z.src}" style="width:100%;border-radius:10px"><p class="tip">${z.alt||''}</p><button class="btn sec" style="width:100%" data-close>Schließen</button>`)});

/* ---------- Bottom-Sheet ---------- */
function sheet(html,onOpen){
  const sh=document.createElement('div');sh.className='shade';
  sh.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;
  sh.addEventListener('click',e=>{if(e.target===sh||e.target.closest('[data-close]'))sh.remove()});
  document.body.appendChild(sh);onOpen&&onOpen(sh.firstChild,()=>sh.remove());return sh;
}

/* ---------- Taschenrechner (frei verschiebbar, mit Zehnerpotenzen) ---------- */
let cExpr='',lastInput=null,cAns='';
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.crow input,.labrow input'))lastInput=e.target});
function calcInit(){
  const w=$('#calcWin'),h=$('#cwh');
  const keys=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0',',','+','=','x²','√','×10³','×10⁻³','×10⁻⁶','×10⁶','π','Ans'];
  $('#ck').innerHTML=keys.map(k=>`<button class="${'÷×−+()'.includes(k)?'op':''}${k==='='?' eq':''}${k.length>1&&k!=='⌫'?' ex':''}" data-k="${k}">${k}</button>`).join('');
  const disp=s=>s.replace(/\*1e(-?\d+)/g,(m,p)=>'×10'+String(p).replace(/-/,'⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])).replace(/Math\.PI/g,'π').replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−').replace(/\./g,',');
  const up=()=>{$('#cdv').textContent=disp(cExpr)||'0'};
  const ev=()=>{const js=cExpr;if(!/^([0-9+\-*/().e]|Math\.PI)+$/.test(js))return NaN;try{return Function('"use strict";return ('+js+')')()}catch(e){return NaN}};
  const press=k=>{

    else if(k==='⌫'){const m=cExpr.match(/(\*1e-?\d+|Math\.PI)$/);cExpr=m?cExpr.slice(0,-m[0].length):cExpr.slice(0,-1)}
    else if(k==='='||k==='x²'||k==='√'){let r=ev();if(k==='x²')r=r*r;if(k==='√')r=Math.sqrt(r);if(!isFinite(r)){$('#cdv').textContent='Fehler';cExpr='';return}$('#cdh').textContent=(k==='='?'':k==='x²'?'( … )² ':'√( … ) ')+disp(cExpr)+' =';cExpr=String(Number(r.toPrecision(10)));cAns=cExpr}
    else if(k==='Ans')cExpr+=cAns;
    else cExpr+=({'÷':'/','×':'*','−':'-',',':'.','×10³':'*1e3','×10⁻³':'*1e-3','×10⁻⁶':'*1e-6','×10⁶':'*1e6','π':'Math.PI'})[k]||k;
    up()};
  $$('#ck button').forEach(b=>b.onclick=()=>press(b.dataset.k));
  document.addEventListener('keydown',e=>{if(w.classList.contains('hidden'))return;if(e.target.matches('input,textarea'))return;
    const m={'Enter':'=','=':'=','Backspace':'⌫','Escape':'C','*':'×','/':'÷','-':'−','+':'+',',':',','.':',','(':'(',')':')'};
    if(/^[0-9]$/.test(e.key))press(e.key);else if(m[e.key]){e.preventDefault();press(m[e.key])}});
  $('#cwIns').onclick=()=>{const r=Number(cExpr);
    if(!lastInput||!document.body.contains(lastInput)||lastInput.disabled){$('#cdh').textContent='Tippe zuerst in ein Eingabefeld.';return}
    if(!cExpr||!isFinite(r)){$('#cdh').textContent='Erst mit = ausrechnen.';return}
    lastInput.value=String(r).replace('.',',');lastInput.focus()};
  const place=(x,y)=>{const ww=w.offsetWidth||286,hh=w.offsetHeight||420;x=Math.max(4,Math.min(innerWidth-ww-4,x));y=Math.max(4,Math.min(innerHeight-Math.min(hh,120),y));w.style.left=x+'px';w.style.top=y+'px'};
  w._place=place;
  h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();const r=w.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
    try{h.setPointerCapture(e.pointerId)}catch(_){}

    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)});
  $('#cwx').onclick=()=>w.classList.add('hidden');
  window.addEventListener('resize',()=>{if(!w.classList.contains('hidden'))place(parseFloat(w.style.left)||0,parseFloat(w.style.top)||0)});
}

/* ---------- Koordinatensystem (SVG) ---------- */
const PL=56,PR=18,PT=14,PB=50;
function plotDims(o){const W=o.w||((window.innerWidth||800)<560?420:600);return {W,H:Math.round((o.h||400)*W/600)}}
function plotSVG(o){
  const {W,H}=plotDims(o),gw=W-PL-PR,gh=H-PT-PB;
  const X=x=>PL+(x-o.xmin)/(o.xmax-o.xmin)*gw, Y=y=>PT+gh-(y-o.ymin)/(o.ymax-o.ymin)*gh;
  const xg=o.xgrid||1,yg=o.ygrid||1,xl=o.xlab||1,yl=o.ylab||5,near=(a,b)=>Math.abs(a-b)<1e-6,isMul=(v,s)=>near(v/s,Math.round(v/s));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(o.aria||'Koordinatensystem')}" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">`;
  s+=`<rect x="${PL}" y="${PT}" width="${gw}" height="${gh}" fill="#fff"/>`;
  for(let x=Math.ceil(o.xmin/xg)*xg;x<=o.xmax+1e-9;x+=xg)s+=`<line x1="${X(x)}" y1="${PT}" x2="${X(x)}" y2="${PT+gh}" stroke="${isMul(x,xl)?'#c3cddb':'#e4e9f0'}" stroke-width="1"/>`;
  for(let y=Math.ceil(o.ymin/yg)*yg;y<=o.ymax+1e-9;y+=yg)s+=`<line x1="${PL}" y1="${Y(y)}" x2="${PL+gw}" y2="${Y(y)}" stroke="${isMul(y,yl)?'#c3cddb':'#e4e9f0'}" stroke-width="1"/>`;
  s+=`<line x1="${PL}" y1="${PT+gh}" x2="${PL+gw+6}" y2="${PT+gh}" stroke="#132033" stroke-width="2"/><path d="M${PL+gw+12} ${PT+gh} l-10 -5 v10z" fill="#132033"/>`;
  s+=`<line x1="${PL}" y1="${PT+gh}" x2="${PL}" y2="${PT-2}" stroke="#132033" stroke-width="2"/><path d="M${PL} ${PT-8} l-5 10 h10z" fill="#132033"/>`;
  for(let x=Math.ceil(o.xmin/xl)*xl;x<=o.xmax+1e-9;x+=xl)s+=`<line x1="${X(x)}" y1="${PT+gh}" x2="${X(x)}" y2="${PT+gh+5}" stroke="#132033" stroke-width="2"/><text x="${X(x)}" y="${PT+gh+21}" text-anchor="middle" font-size="17" fill="#2c3848">${fmt(x,isMul(x,1)?0:1)}</text>`;
  for(let y=Math.ceil(o.ymin/yl)*yl;y<=o.ymax+1e-9;y+=yl)s+=`<line x1="${PL-5}" y1="${Y(y)}" x2="${PL}" y2="${Y(y)}" stroke="#132033" stroke-width="2"/><text x="${PL-9}" y="${Y(y)+5}" text-anchor="end" font-size="17" fill="#2c3848">${fmt(y,0)}</text>`;
  s+=`<text x="${PL+gw}" y="${H-4}" text-anchor="end" font-size="16" font-weight="700" fill="#132033">${o.xt||'x'}</text>`;
  s+=`<text x="${PL+8}" y="${PT+17}" font-size="16" font-weight="700" fill="#132033" stroke="#fff" stroke-width="4" paint-order="stroke">${o.yt||'y'}</text>`;
  s+=`<defs><clipPath id="clp"><rect x="${PL}" y="${PT}" width="${gw}" height="${gh}"/></clipPath></defs><g clip-path="url(#clp)">`;
  (o.lines||[]).forEach(l=>{const x0=l.x0??o.xmin,x1=l.x1??o.xmax;s+=`<line x1="${X(x0)}" y1="${Y(l.m*x0+l.b)}" x2="${X(x1)}" y2="${Y(l.m*x1+l.b)}" stroke="${l.color||'#c2410c'}" stroke-width="${l.w||3.5}" ${l.dash?'stroke-dasharray="9 7"':''} stroke-linecap="round"/>`});
  (o.segs||[]).forEach(g=>{s+=`<line x1="${X(g.x1)}" y1="${Y(g.y1)}" x2="${X(g.x2)}" y2="${Y(g.y2)}" stroke="${g.color||'#555'}" stroke-width="${g.w||2}" ${g.dash?'stroke-dasharray="5 5"':''}/>`});
  s+='</g>';
  (o.points||[]).forEach(p=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r||7}" fill="${p.color||'#16233a'}" stroke="#fff" stroke-width="2"/>`;
    if(p.label)s+=`<text x="${X(p.x)+(p.dx??9)}" y="${Y(p.y)+(p.dy??-9)}" font-size="15" font-weight="800" fill="${p.color||'#16233a'}" stroke="#fff" stroke-width="3" paint-order="stroke">${p.label}</text>`});
  (o.texts||[]).forEach(t=>{s+=`<text x="${X(t.x)}" y="${Y(t.y)}" font-size="${t.size||14}" font-weight="${t.bold===false?400:800}" fill="${t.color||'#132033'}" text-anchor="${t.anchor||'start'}" stroke="#fff" stroke-width="4" paint-order="stroke">${t.t}</text>`});
  return s+'</svg>';
}

/* ---------- Messbild (Oszilloskop-/Prüfgerät-Bildschirm, Canvas) ----------
   o: {xmin,xmax,ymin=0,ymax=100,xdec,ylabels,peaks:[{x,a,w?}],pulse:x,ring,grass,curves:[{f,color,w,noise}],points:[{x,y,color}],
       targets:[x],htargets:[y],marks:[{x,label,row}],hl:[Gitterindex],strich:true(Skalenteile 0…10 statt Werte),gate:{x1,x2,y},corner:'Text'} */
function pulseShape(u){if(u<0||u>5)return 0;const osc=.55+.45*Math.abs(Math.cos(u*6.5));return (u<.3?u/.3:Math.exp(-(u-.3)*1.5))*osc}
function drawScope(cv,o){
  const r=cv.getBoundingClientRect();if(r.width<10)return;
  const dpr=window.devicePixelRatio||1,W=Math.round(r.width),H=Math.round(r.height);
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const ymin=o.ymin??0,ymax=o.ymax??100,pl=38,pr=28,pt=10,pb=26,gw=W-pl-pr,gh=H-pt-pb,ov=pr-4; /* ov: Überlauf rechts, damit Echos auf Strich 10 sichtbar bleiben */
  cv._lay={pl,pr,pt,pb,gw,gh,xmin:o.xmin,xmax:o.xmax,ymin,ymax};cv._o=o;
  const X=x=>pl+(x-o.xmin)/(o.xmax-o.xmin)*gw,Y=a=>pt+gh-(a-ymin)/(ymax-ymin)*gh;
  c.fillStyle='#07140f';c.fillRect(0,0,W,H);
  for(let i=0;i<=10;i++){const x=pl+i*gw/10,h=o.hl&&o.hl.includes(i);c.strokeStyle=h?'rgba(255,196,0,.95)':'rgba(125,255,166,.18)';c.lineWidth=h?2.5:1;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+gh);c.stroke()}
  c.lineWidth=1;c.strokeStyle='rgba(125,255,166,.18)';
  for(let i=0;i<=10;i++){const y=pt+i*gh/10;c.beginPath();c.moveTo(pl,y);c.lineTo(pl+gw,y);c.stroke()}
  if(ymin<0&&ymax>0){c.strokeStyle='rgba(125,255,166,.45)';c.beginPath();c.moveTo(pl,Y(0));c.lineTo(pl+gw,Y(0));c.stroke()}
  c.textAlign='center';const step=W<420&&!o.strich?2:1;
  for(let i=0;i<=10;i+=step){const x=pl+i*gw/10,h=o.hl&&o.hl.includes(i);
    const xv=o.xmin+i*(o.xmax-o.xmin)/10,lab=o.strich?String(i):fmt(xv,o.xdec??(Math.abs(xv-Math.round(xv))<1e-6?0:1));
    c.fillStyle=h?'#ffc400':'rgba(214,255,228,.85)';c.font=(h?'bold 12px':'11px')+' -apple-system,sans-serif';c.fillText(lab,x,H-9)}
  c.textAlign='right';c.fillStyle='rgba(214,255,228,.85)';c.font='11px -apple-system,sans-serif';
  (o.ylabels||[ymin,(ymin+ymax)/2,ymax]).forEach(a=>c.fillText(fmt(a,o.ydec??(Math.abs(a-Math.round(a))<1e-6?0:1)),pl-5,Y(a)+4));
  (o.targets||[]).forEach(t=>{const x=X(t);c.save();c.setLineDash([5,5]);c.strokeStyle='#ffc400';c.lineWidth=2;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+gh);c.stroke();c.restore()});
  (o.htargets||[]).forEach(t=>{const y=Y(t);c.save();c.setLineDash([5,5]);c.strokeStyle='#ffc400';c.lineWidth=2;c.beginPath();c.moveTo(pl,y);c.lineTo(pl+gw,y);c.stroke();c.restore()});
  if(o.gate){c.strokeStyle='#ff6b6b';c.lineWidth=3;const y=Y(o.gate.y);c.beginPath();c.moveTo(X(o.gate.x1),y);c.lineTo(X(o.gate.x2),y);c.stroke()}
  c.save();c.beginPath();c.rect(pl-1,pt-1,gw+ov,gh+2);c.clip();
  const span=o.xmax-o.xmin;
  if(o.peaks||o.pulse!=null){const ew=span*0.011,grass=(o.grass??2);c.beginPath();
    for(let px=0;px<=gw+ov;px++){const x=o.xmin+px/gw*span;let v=Math.random()*grass;
      if(o.pulse!=null)v=Math.max(v,Math.min(98,100*pulseShape((x-o.pulse)/(ew*(o.ring||2.4)))));
      (o.peaks||[]).forEach(e=>{v=Math.max(v,e.a*pulseShape((x-e.x)/(ew*(e.w||1)))*(1+Math.random()*.04))});
      const y=Y(ymin+Math.min(v,99.5)/100*(ymax-ymin));px?c.lineTo(pl+px,y):c.moveTo(pl+px,y)}
    c.strokeStyle='#7dffa6';c.lineWidth=1.6;c.shadowColor='#7dffa6';c.shadowBlur=4;c.stroke();c.shadowBlur=0}
  (o.curves||[]).forEach(cu=>{c.beginPath();let st=false;for(let px=0;px<=gw;px++){const x=o.xmin+px/gw*span;let y=cu.f(x)+(cu.noise?rand(-cu.noise,cu.noise):0);if(!isFinite(y)){st=false;continue}y=Y(y);st?c.lineTo(pl+px,y):c.moveTo(pl+px,y);st=true}
    c.strokeStyle=cu.color||'#7dffa6';c.lineWidth=cu.w||2;c.shadowColor=c.strokeStyle;c.shadowBlur=3;c.stroke();c.shadowBlur=0});
  (o.points||[]).forEach(p=>{c.fillStyle=p.color||'#4fc3ff';c.beginPath();c.arc(X(p.x),Y(p.y),p.r||5,0,7);c.fill()});
  c.restore();
  if(o.corner){c.textAlign='right';c.fillStyle='rgba(214,255,228,.95)';c.font='bold 12px -apple-system,sans-serif';c.fillText(o.corner,pl+gw-4,pt+14)}
  (o.marks||[]).forEach(m=>{const x=X(m.x);c.strokeStyle='#4fc3ff';c.lineWidth=2;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+gh);c.stroke()});
  (o.marks||[]).forEach(m=>{const x=X(m.x);
    c.font='bold 12px -apple-system,sans-serif';const w=c.measureText(m.label).width+10;let bx=Math.min(Math.max(x-w/2,pl),pl+gw-w);
    c.fillStyle='#4fc3ff';c.fillRect(bx,pt+2+(m.row||0)*20,w,18);c.fillStyle='#021';c.textAlign='left';c.fillText(m.label,bx+5,pt+15+(m.row||0)*20)});
}
function scopeToX(cv,clientX){const r=cv.getBoundingClientRect(),L=cv._lay;if(!L)return null;return L.xmin+(clientX-r.left-L.pl)/L.gw*(L.xmax-L.xmin)}
/* makeScope(parent,{title, units:['µs','mm'], before}) → o.cv, o.ro (Anzeigezeile), o.unit, o.onUnit, o.wrap */

/* Regler: {label,min,max,step,val,fmtV,onChange, fine?, coarse?} → Element mit .set(v). Mit coarse: 4 Tasten (−grob −fein +fein +grob) */
function ctlRow({label,min,max,step,val,fmtV,onChange,fine,coarse}){
  const d=document.createElement('div');d.className='ctl';fine=fine||step;const f1=v=>fmt(v,v%1?1:0);
  d.innerHTML=`<div class="lab">${label}<span></span></div>`+(coarse?`<input type="range" min="${min}" max="${max}" step="${step}" value="${val}" style="width:100%"><div class="row btns4"><button class="sbtn" data-d="-${coarse}">−${f1(coarse)}</button><button class="sbtn" data-d="-${fine}">−${f1(fine)}</button><button class="sbtn" data-d="${fine}">+${f1(fine)}</button><button class="sbtn" data-d="${coarse}">+${f1(coarse)}</button></div>`
    :`<div class="row"><button class="sbtn" data-d="-${fine}" aria-label="weniger">−</button><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><button class="sbtn" data-d="${fine}" aria-label="mehr">+</button></div>`);
  const r=$('input',d),sp=$('.lab span',d);
  const set=v=>{v=Math.min(max,Math.max(min,Math.round(v/step)*step));v=Number(v.toFixed(4));r.value=v;sp.innerHTML=fmtV(v);onChange(v)};
  r.oninput=()=>set(+r.value);$$('.sbtn',d).forEach(b=>b.onclick=()=>set(+r.value+ +b.dataset.d));
  sp.innerHTML=fmtV(val);d.set=set;d.get=()=>+r.value;return d;
}
/* Gerätemenü im Hardware-Look: devPanel(parent,{brand,rows:[{k,label,vals:[…]} | {k,label,min,max,step,fmtV}],val:{k:wert},onChange,onOk})
   Bedienung wie am Gerät: ▲▼ Zeile wählen, ◀ ▶ Wert ändern, OK bestätigen. Rückgabe {el,get(k),set(k,v)} */
function devPanel(parent,o){
  const d=document.createElement('div');d.className='dev';const v=Object.assign({},o.val||{});let sel=0;
  d.innerHTML=`<div class="scr"></div><div class="keys"><button data-a="up" aria-label="Zeile hoch">▲</button><button data-a="dn" aria-label="Zeile runter">▼</button><button data-a="l" aria-label="Wert kleiner">◀</button><button data-a="r" aria-label="Wert größer">▶</button><button data-a="ok" class="ok">OK</button></div><div class="brand">${o.brand||''}</div>`;
  parent.appendChild(d);const scr=$('.scr',d);
  const show=R=>R.vals?String(R.vals[v[R.k]]??'—'):(R.fmtV?R.fmtV(v[R.k]):fmt(v[R.k],0));
  const render=()=>{scr.innerHTML=o.rows.map((R,i)=>`<div class="mrow ${i===sel?'sel':''}" data-i="${i}"><span>${R.label}</span><b>${show(R)}</b></div>`).join('')};
  const chg=dir=>{const R=o.rows[sel];if(R.vals)v[R.k]=(v[R.k]+dir+R.vals.length)%R.vals.length;else v[R.k]=Math.min(R.max,Math.max(R.min,Number((v[R.k]+dir*R.step).toFixed(4))));render();o.onChange&&o.onChange(v)};
  $('.keys',d).onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(a==='up')sel=(sel-1+o.rows.length)%o.rows.length;else if(a==='dn')sel=(sel+1)%o.rows.length;else if(a==='l')chg(-1);else if(a==='r')chg(1);else if(a==='ok'){o.onOk&&o.onOk(v);return}render()};
  scr.onclick=e=>{const r=e.target.closest('.mrow');if(r){sel=+r.dataset.i;render()}};
  render();return {el:d,get:k=>v[k],set:(k,x)=>{v[k]=x;render();o.onChange&&o.onChange(v)},vals:v,ok:()=>o.onOk&&o.onOk(v)};
}

  const P=LEVELS.filter(isPflicht),N=P.length,nDone=LEVELS.filter((l,i)=>state.done[i]&&isPflicht(l)).length,nextI=nextOpenIdx(),ri=rankIdx(),pi=planInfo(),nvo=NV[state.nv]||NV[2];

function openLevel(i,si){if(!state.nv){askNiveau(()=>openLevel(i,si));return}cur={li:i,si:si!=null?si:(state.done[i]?0:Math.min(state.stepIdx[i]||0,reach(i)))};show('level');renderStep()}

function bossHP(L,li){const ks=ST(L).map((s,i)=>s.type!=='info'?li+'-'+i:null).filter(Boolean);const n=ks.length,d=ks.filter(k=>state.solved[k]).length;return {n,d,hp:Math.round(100*(1-d/n))}}
function bossBar(L,li){const b=bossHP(L,li),B=L.boss;const el=document.createElement('div');el.className='bossbar';
  el.innerHTML=`<div class="bava" id="bAva">${B.ava}</div><div style="flex:1;min-width:0"><div class="bn">⚔️ ${B.name}</div><div class="bs">${B.role}</div>
   <div class="hp" aria-label="${B.bar}"><i id="bHp" style="width:${b.hp}%"></i></div><div class="hpt" id="bHpt">${B.bar}: ${b.hp} % · ${b.d}/${b.n} Aufgaben gelöst</div></div>`;return el}
function bossHit(){const L=LEVELS[cur.li],b=bossHP(L,cur.li);const i=$('#bHp');if(!i)return;i.style.width=b.hp+'%';$('#bHpt').textContent=`${L.boss.bar}: ${b.hp} % · ${b.d}/${b.n} Aufgaben gelöst`;

  const r=$('.hp').getBoundingClientRect(),e=document.createElement('div');e.className='dmg';e.textContent='−'+Math.round(100/b.n)+' % '+L.boss.bar;e.style.left=Math.max(4,r.right-150)+'px';e.style.top=(r.bottom+6)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
const maxHints=S=>Math.min((S.hints||[]).length,(NV[state.nv]||NV[2]).hints);

    card.innerHTML=head+tk+tx+dt+(S.pre?S.pre():'');
    const api={solved:()=>solved(),wrong:()=>{ctx.attempts++;updReveal()},card,setAuto:f=>{ctx.auto=f;ctx.reveal=S.noReveal?null:f}};
    W[S.type](card,S,api);

function updReveal(){

  const b=document.createElement('button');b.id='revBtn';b.className='btn sec small revealbtn';b.textContent='👁 Lösung zeigen (dann 0 Punkte für diese Aufgabe)';
  b.onclick=()=>{ctx.revealed=true;ctx.reveal();b.remove();const d=document.createElement('div');d.className='hintbox';d.innerHTML='👁 <b>So sieht die Lösung aus.</b> Lies sie genau – mit ◀ kannst du die Aufgabe später nochmal selbst lösen.';$('#hintArea').appendChild(d)};
  $('#hintArea').appendChild(b);

function addPts(p){p=Math.round(p);if(p>0){state.points+=p;updPts();floatPts('+'+p)}}
function solved(silent,fixed){
  if(ctx.solved)return;ctx.solved=true;
  const S=ctx.S,L=LEVELS[cur.li];
  $('#bNext').disabled=false;if(S.bonus)$('#bNext').textContent='Weiter ▶';
  const first=!state.solved[ctx.key];
  state.solved[ctx.key]=1;state.maxStep[cur.li]=Math.max(state.maxStep[cur.li]||0,cur.si+1);
  if(S.proto)state.proto[S.proto[0]]=typeof S.proto[1]==='function'?S.proto[1]():S.proto[1];
  if(!silent&&!state.awarded[ctx.key]){
    let p;
    if(fixed!=null)p=fixed;
    else if(ctx.revealed)p=0;
    else{if(L.boss){p=ctx.attempts===0?15:ctx.attempts===1?10:5;if(ctx.hint>0)p=Math.min(p,5)}
      else p=ctx.attempts===0?10:ctx.attempts===1?6:3;
      if(S.bonus)p+=5;p*=(NV[state.nv]||NV[2]).mult}
    state.awarded[ctx.key]=1;addPts(p);
  }

function confetti(){const cs=['#c2410c','#f2b705','#1b7a47','#17607a','#5b3fc4'];for(let k=0;k<40;k++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cs[k%5];c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}}

/* ---------- Prüfcode (Abgabe-Code für den Ausweis) ---------- */
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function fnv(s){let h=0x811c9dc5;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
const nmHash=n=>fnv(String(n).trim().toLowerCase())&63;
function makeCode(){const pts=Math.min(16383,state.points),q=Math.min(31,quizScore()),nv=(state.nv||2)&3,dn=Math.min(31,LEVELS.filter((l,i)=>state.done[i]).length),nh=nmHash(state.name||CONFIG.defaultName);
  const pay=((pts*32+q)*4+nv)*32*64+dn*64+nh;const ck=fnv(pay+'|'+CONFIG.key+'|'+CONFIG.code)&255;let v=pay*256+ck,s='';for(let k=0;k<8;k++){s=B32[v%32]+s;v=Math.floor(v/32)}return s.slice(0,4)+'-'+s.slice(4)}
function readCode(code,name){const s=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');if(s.length!==8)return null;let v=0;for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;v=v*32+i}
  const ck=v%256,pay=Math.floor(v/256);if((fnv(pay+'|'+CONFIG.key+'|'+CONFIG.code)&255)!==ck)return null;
  const nh=pay%64,dn=Math.floor(pay/64)%32,r=Math.floor(pay/2048),nv=r%4,q=Math.floor(r/4)%32,pts=Math.floor(r/128);
  return {pts,q,nv,dn,nameOk:name?nmHash(name)===nh:null}}
function freigabe(){const miss=[];LEVELS.forEach((L,i)=>{if(isPflicht(L)&&!L.quiz&&!state.done[i])miss.push(L.title)});
  const q=quizScore(),n=QUIZ.length,need=Math.ceil(n*(CONFIG.freigabeQuiz??.65));if(q<need)miss.push(`Abschlussquiz: mindestens ${need} von ${n} richtig (du: ${q})`);return miss}

/* ---------- Eigene Laborwerte (nach dem echten Versuch) ----------
   LAB=[{k,label,u,d, pair:['Ultraschall','Messschieber']} | {k,label,u,d, ref:Zahl|()=>Zahl, refLabel:'Sollwert'}, tolOk:%, tolWarn:%, causes:'…'] */
const labRef=R=>R.ref==null?null:(typeof R.ref==='function'?R.ref():R.ref);
function labEval(R,v){if(!v||v.a==null)return null;const ref=R.pair?v.b:labRef(R);if(ref==null||!isFinite(ref)||ref===0)return null;
  const p=Math.abs(v.a-ref)/Math.abs(ref)*100,ok=R.tolOk??2,wa=R.tolWarn??5,c=p<=ok?'g':p<=wa?'y':'r';
  return {p,c,txt:`<span class="dev3 ${c}">${fmt(p,1)} %</span>`,msg:c==='g'?'Sehr gute Übereinstimmung.':c==='y'?'Akzeptabel. Mögliche Ursachen: Ablesen, Rundung, Koppelmittel.':'Große Abweichung. '+(R.causes||'Prüfe Einstellung, Justierung und Ablesung.')}}
function openLab(){
  sheet(`<h3>🔬 Meine Messwerte aus dem Labor</h3><p class="tip">${CONFIG.labIntro||'Trag hier die Werte aus deinem handschriftlichen Messprotokoll ein. Komma oder Punkt ist egal.'}</p>
   ${LAB.map(R=>{const v=state.lab[R.k]||{};const f=x=>x==null?'':String(x).replace('.',',');
     return `<div class="labrow" data-k="${R.k}"><div class="lt">${R.label}${R.u?` (in ${R.u})`:''}</div><div class="li">
      <label>${R.pair?R.pair[0]:'Mein Wert'} <input inputmode="decimal" data-f="a" value="${f(v.a)}"></label>
      ${R.pair?`<label>${R.pair[1]} <input inputmode="decimal" data-f="b" value="${f(v.b)}"></label>`:`<span class="tip">${R.refLabel||'Sollwert'}: <b>${labRef(R)!=null?fmt(labRef(R),R.d??1)+' '+(R.u||''):'—'}</b></span>`}</div><div class="res"></div></div>`}).join('')}
   <button class="btn blue" style="width:100%;margin-top:6px" id="lEval">Vergleichen ✔</button><button class="btn sec" style="width:100%;margin-top:8px" data-close>Schließen</button>`,(s)=>{
   const run=()=>{let nNew=0;$$('.labrow',s).forEach(row=>{const R=LAB.find(x=>x.k===row.dataset.k);const a=parseNum($('[data-f="a"]',row).value),bI=$('[data-f="b"]',row),b=bI?parseNum(bI.value):null;
       if(!isFinite(a)){$('.res',row).innerHTML='';return}state.lab[R.k]={a,b:isFinite(b)?b:null};const e=labEval(R,state.lab[R.k]);
       $('.res',row).innerHTML=e?`Abweichung ${e.txt} – ${e.msg}`:'<span class="tip">Gespeichert. Für den Vergleich fehlt noch der zweite Wert.</span>';
       if(e&&!state.labPts[R.k]){state.labPts[R.k]=1;nNew++}});
     if(nNew){addPts(5*nNew)}save()};
   $('#lEval',s).onclick=run;if(Object.keys(state.lab).length)run()});
}

/* ---------- Lösungsübersicht (aus den Daten erzeugt, Standard-Niveau) ---------- */
function solutionsHTML(){
  const A=t=>`<span class="a">${t}</span>`;
  const one=S=>{const t=S.title?`<b>${plain(S.title)}</b>: `:'';
    switch(S.type){
     case 'mcq':return t+plain(S.q)+' → '+A(plain(S.o.find(o=>o.ok).t));
     case 'predict':return t+'Prognose (zählt nicht als falsch); fachlich richtig: '+A(plain((S.o.find(o=>o.ok)||{t:'offen'}).t));
     case 'pick':return t+A(S.items.filter(i=>i.ok).map(i=>plain(i.t)).join(', '));
     case 'place':return t+S.slots.map((a,i)=>`${S.nums?S.nums[i]:i+1} = ${A(plain(a))}`).join(' · ');
     case 'seq':return t+'<ol>'+S.items.map(x=>`<li class="a">${plain(x)}</li>`).join('')+'</ol>';
     case 'calc':return t+'<ul>'+S.rows.filter(r=>!r.given).map(r=>`<li>${plain(r.pre)} ${A(fmt(r.ans,r.d??(Number.isInteger(r.ans)?0:1))+' '+plain(r.u||''))}</li>`).join('')+'</ul>';
     case 'decide':return t+S.cards.map(c=>`${plain(c.title)} → ${A(plain(S.actions[c.ans]))}`).join(' · ');
     case 'fault':return t+S.cases.map(c=>`${plain(c.title)} → ${A(plain(c.o.find(o=>o.ok).t))}`).join(' · ');
     case 'cloze':return t+S.parts.map(p=>A(plain(p[1][p[2]]))).join(' | ');
     case 'write':return t+'Freitext, z. B.: '+A(esc(S.example));
     case 'selfcheck':return t+'Selbstkontrolle: '+S.items.map(plain).join('; ');
     case 'sim':return t+A(S.solution||'(siehe Simulation)');
     default:return '';}};
  const sv=state.nv;state.nv=2;prepSteps();
  const h=`<div class="sol"><h3>📄 Lösungsübersicht – ${CONFIG.title}</h3><p class="tip">Niveau Standard. Einsteiger/Profi weichen nur in einzelnen Rechenschritten ab.</p>`+LEVELS.filter(L=>!L.quiz).map(L=>`<h4>${L.title} <small class="m">(${L.tag}${L.kuer?', Kür':''}${L.min?', '+L.min+' min':''})</small></h4><ol>`+ST(L).filter(s=>!['info','quizEnd','kahoot'].includes(s.type)).map(s=>`<li>${one(s)}</li>`).join('')+'</ol>').join('')
    +`<h4>Abschlussquiz</h4><ol>${QUIZ.map(q=>`<li>${plain(q.q)} → ${A(plain(q.o.find(o=>o.ok).t))}</li>`).join('')}</ol></div>`;
  state.nv=sv;prepSteps();return h;
}

    b.onclick=()=>{if(d.dataset.done)return;
      if(o.ok){b.classList.add('ok');d.dataset.done=1;fb.className='fb ok';fb.innerHTML='✅ '+(o.fb||'Richtig!');$$('.opt',ob).forEach(x=>x.disabled=true);onOk&&onOk()}
      else{b.classList.add('bad');b.disabled=true;shake(b);fb.className='fb bad';fb.innerHTML='❌ '+(o.fb||'Noch nicht – versuch es nochmal.');onWrong&&onWrong()}};

 mcq:(c,S,api)=>{const d=mcqW(c,S,api.solved,api.wrong);ctx.auto=d._auto},

 },

 fault:(c,S,api)=>{ /* Störungssuche: je Fall Schirmbild + Symptom → Ursache wählen → Behebung erscheint */

 write:(c,S,api)=>{ /* Freitext → state.sim[save]; mit report:'Überschrift' landet er im Protokoll unter „Bausteine für den Bericht“ */

function buildQuizLevel(){
  const QL=LEVELS[LEVELS.length-1];QL.quiz=true;
  QL.steps=[{type:'info',html:()=>person(`<p>Letzte Runde, ${nm()}! ${QUIZ.length} Fragen zu den wichtigsten Fachbegriffen. Für jede richtige Antwort gibt's <b>10 ⭐</b> – mit Countdown zusätzlich bis zu <b>10 ⭐ Tempo-Bonus</b>. Keine Hilfen, kein Zurück – wie bei Kahoot. 🎯</p>`,QL.host)+
     `<div class="toggle"><span>⏱ Countdown (30 s pro Frage)</span><button id="tgT" class="${state.timer?'':'off'}">${state.timer?'AN':'AUS'}</button></div><p class="tip">Ohne Countdown gibt es keinen Tempo-Bonus, aber auch keinen Zeitdruck.</p>`,
     mount:c=>{$('#tgT',c).onclick=e=>{state.timer=!state.timer;save();e.target.textContent=state.timer?'AN':'AUS';e.target.classList.toggle('off',!state.timer)}}}]
   .concat(QUIZ.map((q,i)=>({type:'kahoot',qi:i,qd:q,hints:[]})))
   .concat([{type:'quizEnd'}]);
  QL._st=QL.steps;
}
function start(){
  state=load();document.title=CONFIG.title;buildQuizLevel();prepSteps();calcInit();actTick();
  $('#bNext').onclick=()=>{const L=LEVELS[cur.li];if(cur.si<ST(L).length-1){cur.si++;renderStep()}else finishLevel()};
  $('#bBack').onclick=()=>{if(cur&&cur.si>0)goStep(cur.si-1)};
  $('#bHint').onclick=()=>{const S=ctx.S,mx=maxHints(S);if(!mx)return;const n=ctx.hint;if(n>=mx){shake($('#hintArea'));return}
    const lbl=['💡 Denkanstoß','📘 Wort-Hilfe','✏️ Erster Schritt'][n]||'💡 Tipp';
    const d=document.createElement('div');d.className='hintbox';d.innerHTML=`<b>${lbl}:</b> ${S.hints[n]}`;$('#hintArea').appendChild(d);
    ctx.hint++;state.hints++;if(LEVELS[cur.li].boss&&!ctx.review)state.bossHints[cur.li]=1;save();
    $('#bHint').textContent=ctx.hint>=mx?'💡 Alle offen':`💡 Hilfe ${ctx.hint+1}/${mx}`;updReveal();d.scrollIntoView({behavior:'smooth',block:'nearest'})};
  $('#bHome').onclick=renderHome;$('#bCalc').onclick=toggleCalc;$('#bData').onclick=openData;$('#bProto').onclick=openProto;
  window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));

}

/* ---- Ultraschall-Bildschirm ----
   P: {R (mm auf 10 SkT), D (Verschiebung mm), ech:[{s,a}] (Schallweg mm, Amplitude % bei 30 dB), dB, mm:true → x-Achse in mm, sonst SkT} */
function utDraw(o,P){const R=P.R,D=P.D??0,g=Math.pow(10,((P.dB??30)-30)/20),mm=!!P.mm;
  const X=s=>mm?s-D:(s-D)/R*10;
  drawScope(o.cv,{xmin:0,xmax:mm?R:10,strich:!mm,peaks:(P.ech||[]).map(e=>({x:X(e.s),a:Math.min(99,e.a*g)})).filter(p=>p.x>-1&&p.x<(mm?R:10)+1),pulse:P.noPulse?null:X(0),grass:P.grass??2.5,
    hl:P.hl,targets:P.targets,marks:P.marks,ylabels:[0,50,100],corner:P.corner??(mm?`${fmt(R,0)} mm`:'x: Skalenteile (SkT)')})}
const rweList=(d,n,base)=>Array.from({length:n},(_,k)=>({s:(k+1)*d+PD,a:(base||70)*Math.pow(.62,k)}));

function simGeraet(c,api){ /* Aufgabe 1: c und Prüfkopf im Menü einstellen */
  c.insertAdjacentHTML('beforeend',`<div class="fig">${TYP}</div>`);
  const say=statusFb(c);
  const dp=devPanel(c,{brand:'ECHOGRAPH · Menü Prüfkopf/Werkstoff',rows:[{k:'c',label:'Schallgeschw.',vals:CVALS.map(v=>v+' m/s')},{k:'pk',label:'Prüfkopf',vals:PK}],val:{c:CVALS.indexOf(C_ST_T),pk:0},
    onChange:()=>say('',''),
    onOk:v=>{if(ctx.solved)return;const cv=CVALS[v.c],pk=v.pk;
      if(cv===C_ST&&pk===PK_OK){state.proto.c=C_ST;state.proto.pk=PK[PK_OK];say('ok','✅ Richtig eingestellt: 5920 m/s (Stahl, longitudinal) und der Normalprüfkopf NK 4/24 vom Typenschild.');api.solved();return}
      api.wrong();const m=[];
      if(cv===C_ST_T)m.push('3255 m/s ist die <b>transversale</b> Schallgeschwindigkeit von Stahl – die braucht man für Winkelprüfköpfe (Versuch 3.3). Der Normalprüfkopf sendet Longitudinalwellen.');
      else if(cv!==C_ST)m.push(`${cv} m/s passt nicht zum K1. Der K1 ist aus <b>Stahl</b>. Schau in 📂 nach.`);
      if(pk!==PK_OK)m.push(pk===0?'WK 45/4 ist ein <b>Winkel</b>prüfkopf.':pk===2?'SE 4/10 ist ein Sender-Empfänger-Prüfkopf – nicht der vom Typenschild.':'NK 2/24 hat 2 MHz – auf dem Typenschild steht 4 MHz.');
      say('bad','❌ '+m.join('<br>'))}});
  c.insertAdjacentHTML('beforeend','<p class="tip">Bedienung wie am Gerät: ▲▼ Zeile wählen, ◀ ▶ Wert ändern, <b>OK</b> (Taste 11) bestätigt.</p>');
  api.setAuto(()=>{dp.set('c',CVALS.indexOf(C_ST));dp.set('pk',PK_OK);dp.ok()});
}
function simKoppel(c,api){ /* Aufgabe 3 + 8: Koppelmittel und Anpressdruck */
  let gel=false,p=0,dB=30,seen={no:false,lo:false,hi:false,gain:false};
  const o=makeScope(c,{title:'Ultraschallprüfgerät · K1 von oben'});
  const ck=checklist(['Ohne Koppelmittel angedrückt','Mit Koppelmittel: leicht angedrückt (unter 30 %)','Mit Koppelmittel: fest angedrückt (über 80 %)','1. Rückwandecho mit der Verstärkung auf 70–90 % BSH gestellt']);
  const tg=document.createElement('div');tg.className='btnrow';tg.innerHTML='<button class="btn sec" id="kG">💧 Koppelmittel: AUS</button>';c.appendChild(tg);
  const cp=ctlRow({label:'Anpressdruck',min:0,max:100,step:5,val:0,fmtV:v=>v+' %',onChange:v=>{p=v;upd()}});c.appendChild(cp);
  const cg=ctlRow({label:'Verstärkung (Taste 9)',min:10,max:50,step:1,val:30,fmtV:v=>v+' dB',onChange:v=>{dB=v;upd()}});c.appendChild(cg);c.appendChild(ck);
  const say=statusFb(c);
  const amp=()=>gel?6+80*(1-Math.exp(-p/28)):(p>0?3:0);
  const upd=()=>{if(p>0&&!gel)seen.no=true;if(gel&&p>0&&p<30)seen.lo=true;if(gel&&p>80)seen.hi=true;const a1=amp()*Math.pow(10,(dB-30)/20);if(seen.hi&&gel&&p>0&&a1>=70&&a1<=90)seen.gain=true;
    ck.set(0,seen.no);ck.set(1,seen.lo);ck.set(2,seen.hi);ck.set(3,seen.gain);
    if(seen.no&&seen.lo&&seen.hi&&seen.gain&&!ctx.solved){state.proto.koppel='ohne Koppelmittel kaum Echo; mit mehr Druck höheres Echo, Lage bleibt';say('ok','✅ Gut beobachtet! Ohne Koppelmittel kommt fast nichts an. Mit Koppelmittel steigt das Echo mit dem Druck – erst stark, dann kaum noch. Die <b>Lage</b> der Echos ändert sich nie.');api.solved()}};
  $('#kG',c).onclick=e=>{gel=!gel;e.target.textContent='💧 Koppelmittel: '+(gel?'AN':'AUS');e.target.classList.toggle('blue',gel);upd()};
  loop(()=>{const a=amp();utDraw(o,{R:250,D:0,dB,ech:a>0?rweList(100,2,a):[],grass:3});o.ro.innerHTML=`<span>1. RWE: <b>${fmt(Math.min(99,a*Math.pow(10,(dB-30)/20)),0)} % BSH</b></span><span>Lage: <b>${fmt(100+PD,1)} mm</b></span>`});
  api.setAuto(()=>{cp.set(40);$('#kG',c).click();cp.set(20);cp.set(90);cg.set(29);cg.set(30)});
}
function simJustage(c,api){ /* Aufgabe 2: 10 SkT = 100 mm, dann 1. RWE auf Strich 10 */
  let R=250,D=0,ph=1;const nv=state.nv||2;
  const o=makeScope(c,{title:'Ultraschallprüfgerät · Justierung am K1'});
  const tk=document.createElement('div');tk.className='task';c.insertBefore(tk,o.wrap);
  const cR=ctlRow({label:'Justierbereich (Taste 10)',min:50,max:300,step:.5,val:R,fine:.5,coarse:10,fmtV:v=>fmt(v,1)+' mm',onChange:v=>{R=v;chk()}});
  const cD=ctlRow({label:'Verschiebung (Taste 8)',min:0,max:150,step:.2,val:D,fine:.2,coarse:5,fmtV:v=>fmt(v,1)+' mm',onChange:v=>{D=v;chk()}});
  c.appendChild(cR);c.appendChild(cD);const say=statusFb(c);
  const pos=n=>(n*100+PD-D)/R*10;
  const setTask=()=>{tk.innerHTML=ph===1?`<b>Schritt 1:</b> Lege den <b>Beginn</b> des 1. ${T('rwe')}s auf Strich <b>0</b> und den Beginn des 2. Rückwandechos auf Strich <b>10</b>. Nutze Justierbereich und Verschiebung.`
     :ph===2?`<b>Schritt 2:</b> Verschiebe jetzt das 1. Rückwandecho auf Strich <b>10</b> – nur mit der Verschiebung (Taste 8). Der Justierbereich bleibt bei 100 mm.`:`<b>Geschafft!</b> Speichere ein Schirmbild für dein Protokoll.`};
  const chk=()=>{if(ph===1&&Math.abs(pos(1))<=.1&&Math.abs(pos(2)-10)<=.1){ph=2;state.proto.R=R;say('ok','✅ Schritt 1 geschafft: 10 SkT entsprechen jetzt 100 mm Schallweg. Weiter mit Schritt 2.');cR.querySelectorAll('button,input').forEach(x=>x.disabled=true);setTask()}
    else if(ph===2&&Math.abs(pos(1)-10)<=.1){ph=3;state.proto.D=D;say('ok',`✅ Justiert! Die x-Achse zeigt jetzt 0 bis 100 mm ab der Oberfläche. Die Verschiebung steht bei ${fmt(D,1)} mm – nicht bei 0: Das ist der ${T('vers','Nullpunkt')} des Prüfkopfs.`);cD.querySelectorAll('button,input').forEach(x=>x.disabled=true);setTask();sb.classList.remove('hidden')}};
  const sb=snapBtn(c,o,'justage','Justierung am K1: 1. RWE auf Strich 10 (0–100 mm)',()=>{if(ph===3&&!ctx.solved)api.solved()});sb.classList.add('hidden');
  setTask();
  loop(()=>{const tg=nv===1?(ph===1?[0,10]:ph===2?[10]:[]):[];
    utDraw(o,{R,D,ech:rweList(100,3),targets:tg,hl:ph===1?[0,10]:ph===2?[10]:[]});
    o.ro.innerHTML=`<span>Bereich: <b>${fmt(R,1)} mm</b></span><span>Verschiebung: <b>${fmt(D,1)} mm</b></span>`+(nv<3?`<span>1. RWE bei <b>${fmt(pos(1),2)} SkT</b></span><span>2. RWE bei <b>${fmt(pos(2),2)} SkT</b></span>`:'')});
  api.setAuto(()=>{cR.set(100);cD.set(100+PD);cD.set(PD);sb.click()});
}
function simK1Mess(c,api){ /* Aufgabe 4: a, b, d am K1 ablesen */
  const ech=[{s:MESS.a,a:48,k:'a'},{s:MESS.b,a:56,k:'b'},{s:MESS.d,a:66,k:'d'}],ord=['a','b','d'],got={};let i=0,mk=[];
  const o=makeScope(c,{title:'K1 über den Stufen · justiert 0–100 mm'});const tk=document.createElement('div');tk.className='task';c.insertBefore(tk,o.wrap);
  const say=statusFb(c);
  const lbl={a:'Stufe a (obere Stufe)',b:'Stufe b (untere Stufe)',d:'Rückwand d'};
  const setTask=()=>{tk.innerHTML=i<3?`${OP('Lies ab')} Tippe auf den <b>Beginn</b> des Echos von <b>${lbl[ord[i]]}</b>.`:'Alle drei Werte stehen im Protokoll 📋.'};setTask();
  o.cv.addEventListener('pointerdown',e=>{if(ctx.solved||i>=3)return;const x=scopeToX(o.cv,e.clientX);const n=ech.reduce((b,q)=>Math.abs(q.s-x)<Math.abs(b.s-x)?q:b);
    if(Math.abs(n.s-x)>4){say('info','Tippe genauer auf ein Echo (grüne Spitze).');return}
    if(n.k!==ord[i]){api.wrong();say('bad',`❌ Das ist das Echo bei ${fmt(n.s,1)} mm. ${n.k==='d'?'Das ist die Rückwand – sie liegt am tiefsten.':n.k==='a'?'Das ist die <b>obere</b> Stufe – sie liegt am nächsten zur Oberfläche.':'Das ist die untere Stufe b.'}`);return}
    got[n.k]=n.s;state.proto[n.k]=n.s;mk.push({x:n.s,label:`${n.k} = ${fmt(n.s,1)} mm`,row:i});i++;say('ok',`✅ ${lbl[n.k]}: <b>${fmt(n.s,1)} mm</b>`);setTask();
    if(i===3){say('ok','✅ Alle Echos abgelesen: a = 85,3 mm, b = 91,2 mm, d = 100,0 mm.');snapScope(o,'k1mess','K1: Echos der Stufen a, b und der Rückwand d');api.solved()}});
  loop(()=>{utDraw(o,{R:100,D:0,mm:true,ech:ech.map(e=>({s:e.s,a:e.a})),marks:mk,noPulse:false});o.ro.innerHTML=`<span>Abgelesen: <b>${Object.keys(got).length}/3</b></span>`});
  api.setAuto(()=>{ord.forEach((k,j)=>{i=j;const e=ech.find(q=>q.k===k);got[k]=e.s;state.proto[k]=e.s;mk.push({x:e.s,label:`${k} = ${fmt(e.s,1)} mm`,row:j})});i=3;setTask();snapScope(o,'k1mess','K1: Echos der Stufen a, b und der Rückwand d');api.solved()});
}

function simAcryl(c,api){ /* Aufgabe 6 (Kür): Bohrungen im Acrylglas */
  let x=5,ci=CVALS.indexOf(C_ST),ph=1;const got={};
  const o=makeScope(c,{title:'Acrylglasquader · Prüfkopf von oben'});const tk=document.createElement('div');tk.className='task';c.insertBefore(tk,o.wrap);

 {type:'mcq',title:'Warum „Normal“prüfkopf?',q:`Was bedeutet „normal“ im Wort ${T('npk')}?`,o:[
   {t:'Er schallt senkrecht zur Oberfläche ein – entlang der Flächennormalen.',ok:1,fb:'Genau. „Normale“ = Senkrechte auf einer Fläche. Er sendet Longitudinalwellen.'},

  hints:['Der K1 ist aus Stahl. Normalprüfkopf → longitudinal.','3255 m/s ist transversal – für Winkelprüfköpfe.','5920 m/s und „NK 4/24“, dann OK.']}

{title:'Level 3: Koppeln & Anpressdruck',tag:'Durchführung',sub:'Koppelmittel, Druck, Verstärkung',badge:'💧 Koppel-Profi',num:3,hour:'Teil 2 · Justieren',min:8,short:'Koppeln',steps:[
 {type:'info',html:()=>person(`<p>Jetzt setzt du den Prüfkopf auf den K1. Bevor du es ausprobierst: Was glaubst du, passiert?</p>`)},
 {type:'predict',title:'Prognose 1',save:'koppel',short:'Ohne Koppelmittel',q:'Was passiert mit dem Rückwandecho, wenn du <b>ohne Koppelmittel</b> misst?',o:[{t:'Das Echo verschwindet fast ganz.',ok:1},{t:'Das Echo bleibt gleich hoch.'},{t:'Das Echo wird sogar höher.'}],hints:['Es gibt hier kein Falsch.','Denk an die dünne Luftschicht.','Wähle, was du erwartest.']},
 {type:'predict',title:'Prognose 2',save:'druck',short:'Fester andrücken',q:'Was passiert, wenn du den Prüfkopf <b>fester andrückst</b>?',o:[{t:'Das Echo wird höher, wandert aber nicht.',ok:1},{t:'Das Echo wandert nach links, weil der Schall schneller wird.'},{t:'Nichts ändert sich.'}],hints:['Es gibt hier kein Falsch.','Denk an die Koppelschicht.','Wähle, was du erwartest.']},
 {type:'sim',title:'Ausprobieren (Aufgabe 3)',task:'Aus der Anleitung (3.1, Aufgabe 3): „Variieren Sie den Anpressdruck des Prüfkopfes vorsichtig und beschreiben Sie dessen Auswirkung auf die Amplitude der Anzeige.“',run:simKoppel,
  solution:'Ohne Koppelmittel kaum Echo; mit Koppelmittel steigt die Echohöhe mit dem Druck (sättigt), Lage bleibt; mit der Verstärkung 1. RWE auf 70–90 % BSH.',hints:['Arbeite die Checkliste von oben nach unten ab.','Koppelmittel AN, dann Druck unter 30 % und über 80 %.','Zum Schluss die Verstärkung so, dass das Echo 70–90 % hoch ist.']},
 {type:'mcq',title:'Warum Koppelmittel?',pre:()=>prognose('koppel'),q:'Warum kommt ohne Koppelmittel fast kein Schall in den Prüfling?',o:[
   {t:'Die dünne Luftschicht reflektiert den Ultraschall fast vollständig – Luft und Stahl sind akustisch sehr verschieden.',ok:1,fb:'Richtig. Das Koppelmittel verdrängt die Luft und „koppelt“ den Prüfkopf an.'},
   {t:'Das Koppelmittel leitet den Strom zum Prüfling.',fb:'Ultraschall ist eine mechanische Welle – Strom fließt hier nicht.'},
   {t:'Ohne Koppelmittel wird der Prüfkopf zu heiß.',fb:'Erwärmung spielt keine Rolle. Es geht um die Luftschicht.'}],
  hints:['Was ist zwischen Prüfkopf und Stahl, wenn kein Gel da ist?','An Grenzflächen wird Schall reflektiert.','Luftspalt → fast alles wird reflektiert.']},
 {type:'mcq',title:'Anpressdruck deuten',pre:()=>prognose('druck'),q:'Was hast du beim Anpressdruck beobachtet?',o:[
   {t:'Mehr Druck → dünnere Koppelschicht → höheres Echo. Die Lage bleibt gleich.',ok:1,fb:'Genau. Deshalb drückt man beim Messen gleichmäßig an.'},
   {t:'Mehr Druck → der Schall wird schneller → das Echo wandert nach links.',fb:'Die Lage hat sich nicht verändert. Die Schallgeschwindigkeit hängt vom Werkstoff ab, nicht vom Druck.'},
   {t:'Mehr Druck → das Echo wird immer weiter höher, ohne Grenze.',fb:'Ab einem bestimmten Druck ändert sich kaum noch etwas – die Schicht ist schon dünn.'}],
  hints:['Schau auf die Anzeige „Lage“.','Höhe ≠ Lage.','Höher, aber nicht verschoben.']},
 {type:'write',title:'Baustein für den Bericht (Aufgabe 8)',text:`${OP('Erkläre')} in 1–2 Sätzen, wozu man ein ${T('kop')} braucht.`,save:'koppelText',report:'Wozu Koppelmittel? (Aufgabe 8)',min:40,keys:['luft','spalt','reflekt','ankopp','übertr','verdräng'],
  example:'Das Koppelmittel verdrängt die Luft zwischen Prüfkopf und Prüfling. Ohne Koppelmittel würde der Luftspalt den Ultraschall fast vollständig reflektieren.',
  okfb:'Gut – das kommt als Baustein in dein Protokoll 📋.',missfb:'Erwähne, was zwischen Prüfkopf und Prüfling ist (Luft) und was sie mit dem Schall macht.',placeholder:'Das Koppelmittel …',hints:['Was verdrängt das Gel?','Luftspalt → Reflexion.','„Das Koppelmittel verdrängt die Luft …“']},
 {type:'mcq',bonus:1,title:'Profi-Frage',q:`${OP('Begründe')} Warum sollte man beim Prüfen möglichst immer gleich fest andrücken?`,o:[
   {t:'Weil sonst Echohöhen nicht vergleichbar sind – Fehler werden oft über die Echohöhe bewertet.',ok:1,fb:'Genau. Schwankender Druck täuscht unterschiedliche Fehlergrößen vor.'},
   {t:'Weil sich sonst die Lage der Echos ändert.',fb:'Die Lage ändert sich nicht – nur die Höhe.'},
   {t:'Weil der Prüfkopf sonst kaputtgeht.',fb:'Vorsicht ist gut, aber der Hauptgrund ist die Vergleichbarkeit.'}],hints:['Was ändert der Druck?','Echohöhe = Hinweis auf Fehlergröße.','Vergleichbarkeit.']}
]},
{title:'Level 4: Justieren am K1',tag:'Durchführung',sub:'10 SkT = 100 mm, Nullpunkt',badge:'📏 Justier-Profi',num:4,hour:'Teil 2 · Justieren',min:12,short:'Justieren',steps:[
 {type:'info',html:()=>person(`<p>Jetzt der wichtigste Schritt: die ${T('just')}. Danach zeigt die x-Achse den ${T('sw')} in mm. Wir nutzen den ${T('k1')}, der genau 100 mm dick ist.</p>`)+photo('k1',{cap:'Abb. 3.3: Kalibrierkörper K1 nach DIN EN ISO 2400 – links die Maße 100 mm, b und a (aus der Versuchsanleitung)'})+`<div class="merke"><b>Merke:</b> Der Bildschirm hat 10 ${T('skt','Skalenteile')} (Striche 0 bis 10). Ziel: 10 SkT = 100 mm. Leg immer den <b>Beginn</b> eines Echos auf den Strich.</div>`},
 {type:'mcq',title:'Wo liegt das 2. Rückwandecho?',q:'Der K1 ist 100 mm dick. Bei welchem Schallweg zeigt das Gerät das <b>2. Rückwandecho</b>?',o:[
   {t:'200 mm',ok:1,fb:'Richtig: Das Gerät zeigt den einfachen Schallweg. Beim 2. RWE ist der Schall zweimal durch den Block hin und zurück – das zählt als 2 · 100 mm.'},
   {t:'100 mm',fb:'Bei 100 mm liegt das 1. Rückwandecho.'},
   {t:'400 mm',fb:'Das wäre richtig, wenn das Gerät Hin- und Rückweg zählen würde. Es zeigt aber schon den einfachen Weg.'}],
  hints:['Das 1. RWE liegt bei d.','Jedes weitere RWE kommt eine Dicke später.','2 · 100 mm']},
 {type:'sim',title:'Justieren (Aufgabe 2)',task:'Aus der Anleitung (3.1, Aufgabe 2): „Justieren Sie das Ultraschallprüfgerät mit Hilfe des Kalibrierkörpers K1, so dass zehn Skalenteile 100 mm des einfachen Schallwegs entsprechen. […] Verschieben Sie nun das erste Rückwandecho auf den elften Teilstrich.“',run:simJustage,
  solution:'Schritt 1: Justierbereich 100 mm, Verschiebung 104,6 mm (1. RWE auf Strich 0, 2. RWE auf Strich 10). Schritt 2: Verschiebung 4,6 mm (1. RWE auf Strich 10). Schirmbild speichern.',
  hints:['Erst den Bereich so ändern, dass zwischen den Echos genau 10 SkT liegen, dann verschieben.','Bereich = 100 mm. Die Verschiebung bewegt beide Echos gleich weit.','Schritt 1: Verschiebung ≈ 104,6 mm. Schritt 2: ≈ 4,6 mm.']},
 {type:'mcq',title:'Warum auf Strich 10?',q:'Warum schiebt man das 1. Rückwandecho am Ende auf Strich 10 (den 11. Teilstrich)?',o:[
   {t:'Dann beginnt die x-Achse an der Oberfläche: Strich 0 = 0 mm, Strich 10 = 100 mm Tiefe.',ok:1,fb:'Genau – jetzt kann man Tiefen direkt ablesen.'},
   {t:'Damit das Echo höher wird.',fb:'Die Verschiebung ändert nur die Lage, nicht die Höhe.'},
   {t:'Damit der K1 auf dem Bildschirm 200 mm dick erscheint.',fb:'Der K1 ist 100 mm dick und soll auch so angezeigt werden.'}],
  hints:['Wo liegt nach Schritt 1 die Oberfläche?','Das 1. RWE kommt aus 100 mm Tiefe.','0 mm am linken Rand.']},
 {type:'mcq',title:'Echo richtig anlegen',q:'Woran legst du ein Echo beim Justieren und Ablesen an den Strich?',o:[
   {t:'An den Beginn (die steigende Flanke) des Echos.',ok:1,fb:'Richtig – so steht es auch in der Anleitung.'},
   {t:'An die höchste Spitze.',fb:'Die Spitze hängt von Form und Verstärkung ab. Der Beginn ist eindeutig.'},
   {t:'Egal, Hauptsache ungefähr.',fb:'Bei 10 mm pro SkT macht „ungefähr“ schnell 2–3 mm Fehler.'}],hints:['Steht in Aufgabe 2.','Die Spitze ist mal breit, mal schmal.','Beginn.']},
 {type:'mcq',bonus:1,title:'Profi-Frage: der Nullpunkt',q:`${OP('Erläutere')} Warum stand die Verschiebung nach Schritt 2 bei 4,6 mm und nicht bei 0 mm?`,o:[
   {t:'Der Schall braucht schon im Prüfkopf (Schutzschicht, Elektronik) etwas Zeit. Diesen Vorlauf zieht die Verschiebung ab.',ok:1,fb:'Genau: Die Verschiebung legt den Nullpunkt auf die Oberfläche des Prüflings.'},
   {t:'Der K1 ist in Wirklichkeit 104,6 mm dick.',fb:'Dann hätten die beiden RWE 104,6 mm Abstand – sie hatten aber genau 100 mm (10 SkT).'},
   {t:'Das ist ein Ablesefehler, man sollte 0 mm einstellen.',fb:'Mit 0 mm läge das 1. RWE bei 104,6 mm – falsch.'}],hints:['Wo startet der Schall wirklich?','Zwischen Kristall und Oberfläche ist noch etwas.','Vorlauf im Prüfkopf.']}
]},
{title:'Gegner 1: Der Audit-Check',tag:'Aufgabenblock 1',sub:'Störungen am Gerät finden',badge:'🛠 Störungssucher',hour:'Teil 2 · Justieren',min:8,short:'Audit',rankUp:'UT-Prüfer Stufe 1',
 boss:{name:'Herr Brandt',role:'Auditor der Qualitätssicherung',ava:'🕵️',bar:'Zweifel',win:'Herr Brandt ist überzeugt: Du findest Fehler selbst!'},steps:[
 {type:'info',html:()=>person(`<p>So, so. Justieren kann jeder, wenn alles klappt. Ich zeige dir Schirmbilder von anderen Prüfern. Findest du heraus, <b>was schiefgelaufen ist</b>?</p><div class="merke"><b>Regeln:</b> 5 Aufgaben. Jede gelöste Aufgabe senkt meinen Zweifel-Balken. Ohne Hilfe gibt es 15 Punkte pro Aufgabe und am Ende +20 Bonus.</div>`,{name:'Herr Brandt',role:'Auditor',ava:'🕵️'})},
 {type:'fault',title:'Fall 1: Alles zu weit rechts',text:'Ein Prüfer misst am K1 (d = 100 mm).',cases:[{title:'Zwei Rückwandechos am K1',info:'Das 1. RWE liegt bei 106,8 mm, das 2. bei 213,6 mm. Der Abstand der Echos ist also 106,8 mm statt 100 mm.',draw:F_C,
   o:[{t:'Falsche Schallgeschwindigkeit eingestellt – der Maßstab stimmt nicht.',ok:1,fb:'Richtig: Wenn schon der <b>Abstand</b> der Echos falsch ist, stimmt der Maßstab nicht – also c.'},
      {t:'Der Nullpunkt (Verschiebung) ist falsch.',fb:'Ein falscher Nullpunkt verschiebt alle Echos gleich – der Abstand bliebe 100 mm.'},
      {t:'Es fehlt Koppelmittel.',fb:'Dann wären die Echos sehr klein, aber nicht verschoben.'}],fix:'Schallgeschwindigkeit auf 5920 m/s stellen. Hier war 6320 m/s (Aluminium) eingestellt: 100 mm · 6320/5920 ≈ 106,8 mm.'}],
  hints:['Vergleiche den Abstand der beiden Echos mit 100 mm.','Falscher Abstand = falscher Maßstab.','Maßstab hängt an c.']},
 {type:'fault',title:'Fall 2: Abstand stimmt, Lage nicht',text:'Ein anderer Prüfer misst am K1 (d = 100 mm).',cases:[{title:'Zwei Rückwandechos am K1',info:'Das 1. RWE liegt bei 104,6 mm, das 2. bei 204,6 mm. Der Abstand ist genau 100 mm.',draw:F_D,
   o:[{t:'Der Nullpunkt ist nicht korrigiert – Schritt 2 der Justierung fehlt.',ok:1,fb:'Genau: Der Abstand stimmt, also stimmt c. Alles ist um 4,6 mm verschoben.'},
      {t:'Falsche Schallgeschwindigkeit eingestellt.',fb:'Dann wäre der Abstand der Echos nicht genau 100 mm.'},
